<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="Gradient beam divider">
  <defs>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#4E4E4E" stop-opacity="0"/>
      <stop offset="25%" stop-color="#4E4E4E"/>
      <stop offset="50%" stop-color="#1B1B1B"/>
      <stop offset="75%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="beamGlow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="40" y="10" width="1120" height="3" rx="1.5" fill="url(#beamGrad)" filter="url(#beamGlow)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- light sweep traveling the beam -->
  <rect x="0" y="8" width="140" height="7" rx="3.5" fill="url(#sweep)" opacity="0.8">
    <animate attributeName="x" values="-140;1200" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- end caps -->
  <circle cx="40" cy="11.5" r="3" fill="#4E4E4E" filter="url(#beamGlow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1160" cy="11.5" r="3" fill="#0D0D0D" filter="url(#beamGlow)">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
