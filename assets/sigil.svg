<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Muxby sigil — hexagonal monogram">
  <defs>
    <linearGradient id="sigilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF">
        <animate attributeName="stop-color" values="#00F5FF;#FF00E5;#9D4EDD;#00F5FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF00E5">
        <animate attributeName="stop-color" values="#FF00E5;#9D4EDD;#00F5FF;#FF00E5" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="sigilGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- rotating outer dashed ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="url(#sigilGrad)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="24s" repeatCount="indefinite"/>
  </circle>
  <!-- counter-rotating tick ring -->
  <circle cx="60" cy="60" r="47" fill="none" stroke="#9D4EDD" stroke-width="1" stroke-dasharray="1 10" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="360 60 60" to="0 60 60" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- hexagon frame -->
  <polygon points="60,20 94,40 94,80 60,100 26,80 26,40"
           fill="#0D1117" stroke="url(#sigilGrad)" stroke-width="2.5" filter="url(#sigilGlow)"/>

  <!-- circuit ticks on hexagon corners -->
  <g stroke="#00F5FF" stroke-width="1.5" opacity="0.8">
    <line x1="60" y1="14" x2="60" y2="20"/>
    <line x1="99" y1="37" x2="94" y2="40"/>
    <line x1="99" y1="83" x2="94" y2="80"/>
    <line x1="60" y1="106" x2="60" y2="100"/>
    <line x1="21" y1="83" x2="26" y2="80"/>
    <line x1="21" y1="37" x2="26" y2="40"/>
  </g>

  <!-- M monogram, drawn as strokes -->
  <path d="M 44 78 L 44 46 L 60 66 L 76 46 L 76 78"
        fill="none" stroke="url(#sigilGrad)" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="140" stroke-dashoffset="140" filter="url(#sigilGlow)">
    <animate attributeName="stroke-dashoffset" values="140;0" dur="2.5s" fill="freeze"/>
  </path>

  <!-- pulse core -->
  <circle cx="60" cy="60" r="2" fill="#FFD700" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="3s" begin="2.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;30;2" dur="3s" begin="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
