<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-label="The Learning Odyssey — metro-map skill roadmap">
  <defs>
    <linearGradient id="lineDone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#9D4EDD"/>
    </linearGradient>
    <linearGradient id="lineNext" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#FF00E5"/>
    </linearGradient>
    <filter id="oGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="460" rx="16" fill="#0D1117" stroke="#30363D"/>
  <text x="500" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" letter-spacing="7" fill="#8B949E"> THE LEARNING ODYSSEY — TRANSIT AUTHORITY OF THE VOID</text>

  <!-- ══ MASTERED LINE (solid, glowing) ══ -->
  <path d="M 80 120 H 320 Q 360 120 360 160 L 360 200 Q 360 240 400 240 H 560"
        fill="none" stroke="url(#lineDone)" stroke-width="5" stroke-linecap="round" filter="url(#oGlow)"/>
  <!-- ══ LEARNING SEGMENT (dash-flowing) ══ -->
  <path d="M 560 240 H 700" fill="none" stroke="#FF00E5" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" values="0;-36" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <!-- ══ FUTURE SEGMENT (faint dashed) ══ -->
  <path d="M 700 240 H 780 Q 820 240 820 280 L 820 330 Q 820 370 860 370 H 900"
        fill="none" stroke="#484F58" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 9"/>
  <!-- ══ DREAM BRANCH (very faint, drifting upward) ══ -->
  <path d="M 700 240 Q 740 240 740 200 L 740 140 Q 740 100 780 100 H 900"
        fill="none" stroke="#3D2E6B" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10"/>

  <!-- ── MASTERED stations ── -->
  <g font-family="'Courier New', monospace" font-size="12" text-anchor="middle">
    <circle cx="80" cy="120" r="9" fill="#0D1117" stroke="#00F5FF" stroke-width="3" filter="url(#oGlow)"/>
    <text x="80" y="95" fill="#00F5FF">FUNDAMENTALS</text>
    <text x="80" y="150" fill="#3FB950"></text>

    <circle cx="200" cy="120" r="9" fill="#0D1117" stroke="#00F5FF" stroke-width="3" filter="url(#oGlow)"/>
    <text x="200" y="95" fill="#00F5FF">WEB PLATFORM</text>
    <text x="200" y="150" fill="#3FB950"></text>

    <circle cx="320" cy="120" r="9" fill="#0D1117" stroke="#4DD8E6" stroke-width="3" filter="url(#oGlow)"/>
    <text x="320" y="95" fill="#4DD8E6">BACKEND CRAFT</text>
    <text x="320" y="150" fill="#3FB950"></text>

    <circle cx="360" cy="200" r="9" fill="#0D1117" stroke="#9D4EDD" stroke-width="3" filter="url(#oGlow)"/>
    <text x="418" y="188" fill="#9D4EDD">CLOUD NATIVE </text>

    <circle cx="480" cy="240" r="9" fill="#0D1117" stroke="#9D4EDD" stroke-width="3" filter="url(#oGlow)"/>
    <text x="480" y="270" fill="#9D4EDD">ML FOUNDATIONS</text>
    <text x="480" y="286" fill="#3FB950"></text>
  </g>

  <!-- ── LEARNING NOW (pulsing) ── -->
  <g font-family="'Courier New', monospace" text-anchor="middle">
    <circle cx="560" cy="240" r="11" fill="#0D1117" stroke="#FF00E5" stroke-width="3.5" filter="url(#oGlow)">
      <animate attributeName="r" values="11;14;11" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="240" r="11" fill="none" stroke="#FF00E5" stroke-width="1.5">
      <animate attributeName="r" values="11;26" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="560" y="212" font-size="12" fill="#FF00E5">⟢ AGENTIC AI ⟣</text>
    <text x="560" y="274" font-size="11" fill="#FF00E5">◉ YOU ARE HERE</text>
  </g>

  <!-- ── NEXT TARGET (locked) ── -->
  <g font-family="'Courier New', monospace" font-size="12" text-anchor="middle">
    <circle cx="700" cy="240" r="9" fill="#0D1117" stroke="#8B949E" stroke-width="3"/>
    <text x="700" y="212" fill="#8B949E">RUST </text>
    <text x="700" y="270" font-size="10" fill="#484F58">unlock: ship 1 CLI</text>

    <circle cx="820" cy="300" r="9" fill="#0D1117" stroke="#8B949E" stroke-width="3"/>
    <text x="868" y="288" fill="#8B949E">DIST-SYS </text>
    <text x="880" y="316" font-size="10" fill="#484F58">unlock: read the papers</text>
  </g>

  <!-- ── DREAM TECH (distant constellation) ── -->
  <g font-family="'Courier New', monospace" font-size="11" text-anchor="middle" opacity="0.85">
    <circle cx="780" cy="100" r="5" fill="#3D2E6B" stroke="#9D4EDD" stroke-width="1.5">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="780" y="80" fill="#7D5BA6"> QUANTUM</text>
    <circle cx="880" cy="100" r="5" fill="#3D2E6B" stroke="#9D4EDD" stroke-width="1.5">
      <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="885" y="80" fill="#7D5BA6"> NEUROMORPHIC</text>
  </g>

  <!-- ── FINAL BOSS ── -->
  <g font-family="'Courier New', monospace" text-anchor="middle">
    <polygon points="900,340 926,355 926,385 900,400 874,385 874,355"
             fill="#1A1205" stroke="#FFD700" stroke-width="3" filter="url(#oGlow)">
      <animate attributeName="stroke-width" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <text x="900" y="376" font-size="16" fill="#FFD700"></text>
    <text x="900" y="424" font-size="11" fill="#FFD700">FINAL BOSS · 5-YEAR VISION</text>
    <text x="900" y="440" font-size="10" fill="#8B949E">"systems that outlive me"</text>
  </g>

  <!-- train running the mastered line -->
  <g>
    <rect x="-14" y="-6" width="28" height="12" rx="6" fill="#00F5FF" opacity="0.95" filter="url(#oGlow)">
      <animateMotion path="M 80 120 H 320 Q 360 120 360 160 L 360 200 Q 360 240 400 240 H 560" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- legend -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#8B949E">
    <circle cx="80" cy="330" r="5" fill="#0D1117" stroke="#00F5FF" stroke-width="2.5"/><text x="94" y="334">MASTERED</text>
    <circle cx="80" cy="356" r="5" fill="#0D1117" stroke="#FF00E5" stroke-width="2.5"/><text x="94" y="360">LEARNING NOW</text>
    <circle cx="80" cy="382" r="5" fill="#0D1117" stroke="#8B949E" stroke-width="2.5"/><text x="94" y="386">NEXT TARGET </text>
    <circle cx="80" cy="408" r="5" fill="#3D2E6B" stroke="#9D4EDD" stroke-width="1.5"/><text x="94" y="412">DREAM TECH </text>
    <polygon points="80,426 87,430 87,438 80,442 73,438 73,430" fill="#1A1205" stroke="#FFD700" stroke-width="1.5"/><text x="94" y="438">FINAL BOSS </text>
  </g>
</svg>
