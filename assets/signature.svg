<svg xmlns="http://www.w3.org/2000/svg" width="360" height="140" viewBox="0 0 360 140" role="img" aria-label="Muxby signature">
  <defs>
    <linearGradient id="sigGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E4E4E"/>
      <stop offset="50%" stop-color="#1B1B1B"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <filter id="sGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- handwritten-style signature, self-drawing -->
  <path d="M 40 88
           C 46 60 54 52 58 60
           C 62 68 60 84 64 84
           C 70 84 72 58 78 58
           C 84 58 82 84 88 84
           C 94 84 96 60 100 60
           M 112 66 C 108 84 118 90 126 82 C 132 76 130 66 126 66 C 134 74 140 84 146 82
           M 158 60 C 154 82 156 86 162 82 C 168 78 172 70 174 66 C 172 78 176 86 184 80
           M 196 48 C 192 70 190 84 194 84 C 198 84 206 62 210 66 C 214 70 208 84 214 84 C 218 84 222 78 224 72
           M 236 66 C 232 78 234 88 240 82 C 246 76 250 68 252 64 C 250 76 246 96 240 106 C 234 114 226 112 230 104 C 234 96 248 88 258 80"
        fill="none" stroke="url(#sigGrad)" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="620" stroke-dashoffset="620" filter="url(#sGlow)">
    <animate attributeName="stroke-dashoffset" values="620;0" dur="3.5s" fill="freeze"/>
  </path>

  <!-- flourish underline -->
  <path d="M 30 104 C 110 96 250 96 330 104" fill="none" stroke="url(#sigGrad)" stroke-width="1.5"
        stroke-linecap="round" stroke-dasharray="310" stroke-dashoffset="310" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="310;0" dur="1.2s" begin="3.2s" fill="freeze"/>
  </path>

  <!-- terminal caption -->
  <text x="180" y="128" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="4" fill="#313131">
    // muxby — signed in the void
    <animate attributeName="opacity" values="0;0;1" dur="4s" fill="freeze"/>
  </text>

  <!-- gold spark at pen-lift -->
  <circle cx="258" cy="80" r="0" fill="#7E7E7E" filter="url(#sGlow)">
    <animate attributeName="r" values="0;5;0" dur="1.2s" begin="3.4s" repeatCount="indefinite"/>
  </circle>
</svg>
