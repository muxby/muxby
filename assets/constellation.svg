<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Minimal premium technology constellation and selected stack map">
  <title>The Muxby System — Technology Constellation</title>
  <desc>A minimal editorial technology constellation with a centered Core, widely spaced system nodes, and a curated stack grouped into languages, web, data, infrastructure, and AI.</desc>
  <defs>
    <pattern id="paperGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#24313A" stroke-width="0.55" opacity="0.28"/>
    </pattern>
    <radialGradient id="coreWash" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E6EDF3" stop-opacity="0.16"/>
      <stop offset="0.52" stop-color="#8B949E" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#8B949E" stop-opacity="0"/>
    </radialGradient>
    <filter id="softCore" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <style>
      .title { fill:#E6EDF3; font-family:Georgia, 'Times New Roman', serif; font-size:14px; letter-spacing:7px; }
      .meta { fill:#72808A; font-family:'Courier New', monospace; font-size:8px; letter-spacing:2.5px; }
      .node-label { fill:#111820; font-family:'Courier New', monospace; font-size:10px; letter-spacing:1.2px; }
      .core-label { fill:#B4C0C8; font-family:'Courier New', monospace; font-size:10px; letter-spacing:5px; }
      .panel-title { fill:#D8E0E5; font-family:'Courier New', monospace; font-size:10px; letter-spacing:3px; }
      .panel-index { fill:#63717B; font-family:'Courier New', monospace; font-size:8px; letter-spacing:2px; }
      .stack-line { fill:#9BA8B0; font-family:'Courier New', monospace; font-size:8.5px; letter-spacing:1px; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="12" fill="#0A0F14"/>
  <rect width="1200" height="760" rx="12" fill="url(#paperGrid)"/>
  <path d="M30 62H1170M30 492H1170" stroke="#AAB8C2" stroke-opacity="0.12"/>

  <text x="600" y="38" text-anchor="middle" class="title">THE MUXBY SYSTEM — CONSTELLATION</text>
  <text x="42" y="736" class="meta">SELECTED STACK / SYSTEM MAP</text>
  <text x="1158" y="736" text-anchor="end" class="meta">EST. IN THE VOID</text>

  <!-- Main constellation: low-contrast paths keep the hierarchy on the nodes. -->
  <g fill="none" stroke="#788791" stroke-width="1" stroke-opacity="0.42" stroke-dasharray="4 8" stroke-linecap="round">
    <path d="M138 146C250 80 360 84 600 248" pathLength="1"><animate attributeName="stroke-dashoffset" values="1;0;1" dur="8s" repeatCount="indefinite"/></path>
    <path d="M685 142C650 160 625 205 600 248" pathLength="1"><animate attributeName="stroke-dashoffset" values="0;1;0" dur="7s" repeatCount="indefinite"/></path>
    <path d="M914 142C820 150 710 200 600 248" pathLength="1"><animate attributeName="stroke-dashoffset" values="1;0;1" dur="9s" repeatCount="indefinite"/></path>
    <path d="M1069 170C960 160 800 180 600 248" pathLength="1"><animate attributeName="stroke-dashoffset" values="0;1;0" dur="6.5s" repeatCount="indefinite"/></path>
    <path d="M147 376C300 360 450 300 600 248" pathLength="1"><animate attributeName="stroke-dashoffset" values="1;0;1" dur="8.5s" repeatCount="indefinite"/></path>
    <path d="M350 414C430 370 500 300 600 248" pathLength="1"><animate attributeName="stroke-dashoffset" values="0;1;0" dur="7.5s" repeatCount="indefinite"/></path>
    <path d="M840 414C770 360 700 300 600 248" pathLength="1"><animate attributeName="stroke-dashoffset" values="1;0;1" dur="9.5s" repeatCount="indefinite"/></path>
    <path d="M1068 376C900 340 780 280 600 248" pathLength="1"><animate attributeName="stroke-dashoffset" values="0;1;0" dur="7.2s" repeatCount="indefinite"/></path>
    <path d="M138 146C205 218 182 310 147 376M1069 170C1010 240 1030 320 1068 376" stroke-opacity="0.18"/>
  </g>

  <g fill="#8997A0" opacity="0.32">
    <circle cx="62" cy="88" r="1.4"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1138" cy="92" r="1.1"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="464" r="1.2"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1148" cy="466" r="1.5"><animate attributeName="opacity" values="0.75;0.2;0.75" dur="4.3s" repeatCount="indefinite"/></circle>
  </g>

  <circle cx="600" cy="248" r="78" fill="url(#coreWash)" filter="url(#softCore)">
    <animate attributeName="r" values="68;86;68" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.68;0.35" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Main nodes -->
  <g fill="#D8E0E5" stroke="#87949D" stroke-width="1" filter="url(#nodeShadow)">
    <rect x="84" y="106" width="108" height="40" rx="2"/>
    <rect x="620" y="88" width="130" height="40" rx="2"/>
    <rect x="860" y="102" width="108" height="40" rx="2"/>
    <rect x="1030" y="130" width="78" height="40" rx="2"/>
    <rect x="68" y="356" width="158" height="40" rx="2"/>
    <rect x="300" y="394" width="100" height="40" rx="2"/>
    <rect x="770" y="394" width="140" height="40" rx="2"/>
    <rect x="1018" y="356" width="100" height="40" rx="2"/>
  </g>
  <g text-anchor="middle" class="node-label">
    <text x="138" y="131">PYTHON</text>
    <text x="685" y="113" font-size="9" textLength="116" lengthAdjust="spacingAndGlyphs">TYPESCRIPT</text>
    <text x="914" y="127">REACT</text>
    <text x="1069" y="155">GO</text>
    <text x="147" y="381" font-size="8.5" textLength="146" lengthAdjust="spacingAndGlyphs">FEDERATED ML</text>
    <text x="350" y="419">OPENAI</text>
    <text x="840" y="419" font-size="8.5" textLength="128" lengthAdjust="spacingAndGlyphs">KUBERNETES</text>
    <text x="1068" y="381">DOCKER</text>
  </g>

  <g fill="#E6EDF3" stroke="#8B949E" stroke-width="1">
    <circle cx="138" cy="158" r="5"><animate attributeName="r" values="4;7;4" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="685" cy="140" r="5"><animate attributeName="r" values="5;8;5" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="914" cy="154" r="5"><animate attributeName="r" values="4;7;4" dur="4.9s" repeatCount="indefinite"/></circle>
    <circle cx="1069" cy="182" r="5"><animate attributeName="r" values="5;8;5" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="147" cy="410" r="5"><animate attributeName="r" values="4;7;4" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="448" r="5"><animate attributeName="r" values="5;8;5" dur="5.1s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="448" r="5"><animate attributeName="r" values="4;7;4" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="1068" cy="410" r="5"><animate attributeName="r" values="5;8;5" dur="3.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Empty Core and dedicated relay beneath it. -->
  <g fill="#111820" stroke="#D5DEE4" stroke-width="1.4">
    <circle cx="600" cy="248" r="30"><animate attributeName="r" values="28;31;28" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="248" r="20" fill="none" stroke="#7E8C96" stroke-dasharray="2 5"><animateTransform attributeName="transform" type="rotate" from="0 600 248" to="360 600 248" dur="14s" repeatCount="indefinite"/></circle>
  </g>
  <text x="600" y="296" text-anchor="middle" class="core-label">CORE</text>
  <path d="M570 328 C580 316 620 316 630 328 C620 340 580 340 570 328" fill="none" stroke="#8B949E" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2 5"/>
  <g fill="#E6EDF3">
    <circle r="3"><animateMotion dur="4.8s" repeatCount="indefinite" path="M570 328 C580 316 620 316 630 328 C620 340 580 340 570 328"/></circle>
    <circle r="3"><animateMotion dur="4.8s" begin="1.6s" repeatCount="indefinite" path="M570 328 C580 316 620 316 630 328 C620 340 580 340 570 328"/></circle>
    <circle r="3"><animateMotion dur="4.8s" begin="3.2s" repeatCount="indefinite" path="M570 328 C580 316 620 316 630 328 C620 340 580 340 570 328"/></circle>
  </g>

  <!-- Category branches remain separated from the Core relay and lower panels. -->
  <g fill="none" stroke="#788791" stroke-width="1" stroke-opacity="0.24" stroke-dasharray="3 7">
    <path d="M600 384V478H132V500"/>
    <path d="M600 384V478H366V500"/>
    <path d="M600 384V500"/>
    <path d="M600 384V478H834V500"/>
    <path d="M600 384V478H1068V500"/>
  </g>
  <g fill="#D4DEE4">
    <circle cx="132" cy="500" r="2.5"/><circle cx="366" cy="500" r="2.5"/><circle cx="600" cy="500" r="2.5"/><circle cx="834" cy="500" r="2.5"/><circle cx="1068" cy="500" r="2.5"/>
  </g>

  <!-- Minimal stack map: text-first panels replace the dense chip treatment. -->
  <g fill="#0D141A" stroke="#2A3740" stroke-width="1">
    <rect x="24" y="516" width="216" height="202" rx="5"/>
    <rect x="258" y="516" width="216" height="202" rx="5"/>
    <rect x="492" y="516" width="216" height="202" rx="5"/>
    <rect x="726" y="516" width="216" height="202" rx="5"/>
    <rect x="960" y="516" width="216" height="202" rx="5"/>
  </g>

  <!-- Languages -->
  <g>
    <text x="42" y="548" class="panel-title">LANGUAGES</text><text x="222" y="548" text-anchor="end" class="panel-index">01</text>
    <path d="M42 558H222" stroke="#54636D" stroke-opacity="0.45"/>
    <g class="stack-line">
      <text x="42" y="580">PYTHON · TYPESCRIPT</text>
      <text x="42" y="603">JAVASCRIPT · GO · SQL</text>
      <text x="42" y="626">C++ · C · PHP</text>
      <text x="42" y="649">SHELL · BASH · SFML</text>
      <text x="42" y="672">RUST / TAURI</text>
    </g>
  </g>

  <!-- Web and application -->
  <g>
    <text x="276" y="548" class="panel-title">WEB / APP</text><text x="456" y="548" text-anchor="end" class="panel-index">02</text>
    <path d="M276 558H456" stroke="#54636D" stroke-opacity="0.45"/>
    <g class="stack-line">
      <text x="276" y="580">REACT · NEXT.JS</text>
      <text x="276" y="603">TAILWIND · VITE · THREE.JS</text>
      <text x="276" y="626">HTML / CSS · NODE.JS</text>
      <text x="276" y="649">FASTAPI · DJANGO</text>
      <text x="276" y="672">GRAPHQL · GRPC</text>
    </g>
  </g>

  <!-- Data -->
  <g>
    <text x="510" y="548" class="panel-title">DATA</text><text x="690" y="548" text-anchor="end" class="panel-index">03</text>
    <path d="M510 558H690" stroke="#54636D" stroke-opacity="0.45"/>
    <g class="stack-line">
      <text x="510" y="580">POSTGRESQL · REDIS</text>
      <text x="510" y="603">MONGODB · SQLITE</text>
      <text x="510" y="626">PGVECTOR</text>
    </g>
  </g>

  <!-- Infrastructure -->
  <g>
    <text x="744" y="548" class="panel-title">INFRA</text><text x="924" y="548" text-anchor="end" class="panel-index">04</text>
    <path d="M744 558H924" stroke="#54636D" stroke-opacity="0.45"/>
    <g class="stack-line">
      <text x="744" y="580">AWS · DOCKER</text>
      <text x="744" y="603">KUBERNETES · BASH</text>
      <text x="744" y="626">TERRAFORM · CLOUDFLARE</text>
    </g>
  </g>

  <!-- AI systems -->
  <g>
    <text x="978" y="548" class="panel-title">AI SYSTEMS</text><text x="1158" y="548" text-anchor="end" class="panel-index">05</text>
    <path d="M978 558H1158" stroke="#54636D" stroke-opacity="0.45"/>
    <g class="stack-line">
      <text x="978" y="580">OPENAI · ANTHROPIC</text>
      <text x="978" y="603">LANGCHAIN · MCP</text>
      <text x="978" y="626">HUGGING FACE</text>
      <text x="978" y="649">TENSORFLOW · PYTORCH</text>
      <text x="978" y="672">FEDERATED LEARNING</text>
      <text x="978" y="695">LLM EVALUATION</text>
    </g>
  </g>
</svg>
