<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Animated monochrome technology constellation map">
  <title>The Muxby System — Technology Constellation</title>
  <desc>A restrained editorial systems map with animated connection paths, pulsing nodes, and a central signal core.</desc>
  <defs>
    <pattern id="paperGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#050505" stroke-width="0.6" opacity="0.34"/>
    </pattern>
    <radialGradient id="coreWash" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E5E5E5" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#4E4E4E" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#4E4E4E" stop-opacity="0"/>
    </radialGradient>
    <filter id="softCore" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#050505" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="900" height="420" rx="12" fill="#050505" stroke="#1B1B1B" stroke-width="1"/>
  <rect width="900" height="420" rx="12" fill="url(#paperGrid)"/>
  <path d="M26 70H874M26 350H874" stroke="#7E7E7E" stroke-opacity="0.1"/>

  <g fill="#7E7E7E" font-family="Georgia, 'Times New Roman', serif">
    <text x="450" y="34" text-anchor="middle" font-size="13" letter-spacing="6">THE MUXBY SYSTEM — TECH CONSTELLATION</text>
    <text x="42" y="396" font-family="'Courier New', monospace" font-size="9" letter-spacing="3" opacity="0.58">LANGUAGES / FRAMEWORKS / INFRASTRUCTURE / AI</text>
    <text x="858" y="396" text-anchor="end" font-family="'Courier New', monospace" font-size="9" letter-spacing="2" opacity="0.42">EST. IN THE VOID</text>
  </g>

  <g fill="none" stroke="#4E4E4E" stroke-width="1" stroke-opacity="0.55" stroke-dasharray="4 7" stroke-linecap="round">
    <path d="M148 132C236 92 330 84 450 205" pathLength="1"><animate attributeName="stroke-dashoffset" values="1;0;1" dur="8s" repeatCount="indefinite"/></path>
    <path d="M328 92C380 118 420 160 450 205" pathLength="1"><animate attributeName="stroke-dashoffset" values="0;1;0" dur="7s" repeatCount="indefinite"/></path>
    <path d="M615 112C560 130 505 169 450 205" pathLength="1"><animate attributeName="stroke-dashoffset" values="1;0;1" dur="9s" repeatCount="indefinite"/></path>
    <path d="M772 142C688 118 652 113 615 112" pathLength="1"><animate attributeName="stroke-dashoffset" values="0;1;0" dur="6.5s" repeatCount="indefinite"/></path>
    <path d="M752 284C670 270 590 238 450 205" pathLength="1"><animate attributeName="stroke-dashoffset" values="1;0;1" dur="8.5s" repeatCount="indefinite"/></path>
    <path d="M610 332C570 290 520 245 450 205" pathLength="1"><animate attributeName="stroke-dashoffset" values="0;1;0" dur="7.5s" repeatCount="indefinite"/></path>
    <path d="M300 306C342 270 390 235 450 205" pathLength="1"><animate attributeName="stroke-dashoffset" values="1;0;1" dur="9.5s" repeatCount="indefinite"/></path>
    <path d="M118 268C210 250 320 232 450 205" pathLength="1"><animate attributeName="stroke-dashoffset" values="0;1;0" dur="7.2s" repeatCount="indefinite"/></path>
    <path d="M148 132C205 193 180 245 118 268M300 306C396 348 520 352 610 332M615 112C676 174 713 229 752 284" stroke-opacity="0.24"/>
  </g>

  <g fill="#4E4E4E" opacity="0.42">
    <circle cx="78" cy="96" r="1.4"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="84" r="1.1"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="332" r="1.2"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="834" cy="328" r="1.5"><animate attributeName="opacity" values="0.75;0.2;0.75" dur="4.3s" repeatCount="indefinite"/></circle>
  </g>

  <circle cx="450" cy="205" r="78" fill="url(#coreWash)" filter="url(#softCore)">
    <animate attributeName="r" values="68;86;68" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.44;0.78;0.44" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <g fill="#7E7E7E" stroke="#313131" stroke-width="1" filter="url(#nodeShadow)">
    <rect x="116" y="106" width="64" height="36" rx="2"/>
    <rect x="296" y="74" width="72" height="36" rx="2"/>
    <rect x="579" y="94" width="72" height="36" rx="2"/>
    <rect x="736" y="124" width="72" height="36" rx="2"/>
    <rect x="716" y="266" width="72" height="36" rx="2"/>
    <rect x="574" y="314" width="72" height="36" rx="2"/>
    <rect x="264" y="288" width="72" height="36" rx="2"/>
    <rect x="82" y="250" width="72" height="36" rx="2"/>
  </g>

  <g fill="#050505" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">
    <text x="148" y="128">PYTHON</text>
    <text x="332" y="96">TYPESCRIPT</text>
    <text x="615" y="116">REACT</text>
    <text x="772" y="146">NODE.JS</text>
    <text x="752" y="288">DOCKER</text>
    <text x="610" y="336">KUBERNETES</text>
    <text x="300" y="310">PYTORCH</text>
    <text x="118" y="272">LLMs</text>
  </g>

  <g fill="#E5E5E5" stroke="#313131" stroke-width="1">
    <circle cx="148" cy="132" r="5"><animate attributeName="r" values="4;7;4" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="332" cy="92" r="5"><animate attributeName="r" values="5;8;5" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="615" cy="112" r="5"><animate attributeName="r" values="4;7;4" dur="4.9s" repeatCount="indefinite"/></circle>
    <circle cx="772" cy="142" r="5"><animate attributeName="r" values="5;8;5" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="752" cy="284" r="5"><animate attributeName="r" values="4;7;4" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="332" r="5"><animate attributeName="r" values="5;8;5" dur="5.1s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="306" r="5"><animate attributeName="r" values="4;7;4" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="118" cy="268" r="5"><animate attributeName="r" values="5;8;5" dur="3.9s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="#050505" stroke="#7E7E7E" stroke-width="1.4">
    <circle cx="450" cy="205" r="30"><animate attributeName="r" values="28;31;28" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="205" r="20" fill="none" stroke="#4E4E4E" stroke-dasharray="2 5"><animateTransform attributeName="transform" type="rotate" from="0 450 205" to="360 450 205" dur="14s" repeatCount="indefinite"/></circle>
  </g>
  <text x="450" y="211" text-anchor="middle" fill="#E5E5E5" font-family="Georgia, serif" font-size="22" letter-spacing="3">M</text>
  <text x="450" y="252" text-anchor="middle" fill="#4E4E4E" font-family="'Courier New', monospace" font-size="9" letter-spacing="3">CORE / SYSTEMS</text>

  <g fill="#E5E5E5">
    <circle r="3"><animateMotion dur="5s" repeatCount="indefinite" path="M148 132C236 92 330 84 450 205"/></circle>
    <circle r="3"><animateMotion dur="6.5s" repeatCount="indefinite" path="M752 284C670 270 590 238 450 205"/></circle>
    <circle r="3"><animateMotion dur="5.8s" repeatCount="indefinite" path="M118 268C210 250 320 232 450 205"/></circle>
  </g>
</svg>
