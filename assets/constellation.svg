<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Tech constellation map — each star is a technology">
  <defs>
    <linearGradient id="conGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#FF00E5"/>
    </linearGradient>
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9D4EDD" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="420" rx="16" fill="#0D1117" stroke="#30363D"/>

  <!-- background dust -->
  <g fill="#484F58">
    <circle cx="60" cy="50" r="1"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="60" r="1"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="370" r="1"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="380" r="1"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="30" r="1"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="395" r="1"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <text x="450" y="38" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" letter-spacing="8" fill="#8B949E">✦ THE MUXBY SYSTEM — TECH CONSTELLATION ✦</text>

  <!-- constellation edges -->
  <g stroke="#3D2E6B" stroke-width="1" stroke-dasharray="4 4" opacity="0.8">
    <line x1="450" y1="210" x2="180" y2="120"/>
    <line x1="450" y1="210" x2="310" y2="300"/>
    <line x1="450" y1="210" x2="620" y2="110"/>
    <line x1="450" y1="210" x2="700" y2="280"/>
    <line x1="180" y1="120" x2="130" y2="250"/>
    <line x1="180" y1="120" x2="330" y2="90"/>
    <line x1="330" y1="90"  x2="620" y2="110"/>
    <line x1="620" y1="110" x2="770" y2="140"/>
    <line x1="770" y1="140" x2="700" y2="280"/>
    <line x1="700" y1="280" x2="560" y2="340"/>
    <line x1="560" y1="340" x2="310" y2="300"/>
    <line x1="310" y1="300" x2="130" y2="250"/>
    <line x1="450" y1="210" x2="560" y2="340"/>
  </g>

  <!-- central core: the sigil star -->
  <circle cx="450" cy="210" r="60" fill="url(#coreGlow)"/>
  <polygon points="450,190 467,200 467,220 450,230 433,220 433,200"
           fill="#0D1117" stroke="url(#conGrad)" stroke-width="2" filter="url(#starGlow)"/>
  <path d="M 442 224 L 442 198 L 450 210 L 458 198 L 458 224" fill="none" stroke="#00F5FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="450" cy="210" r="24" fill="none" stroke="url(#conGrad)" stroke-width="1" stroke-dasharray="3 6">
    <animateTransform attributeName="transform" type="rotate" from="0 450 210" to="360 450 210" dur="20s" repeatCount="indefinite"/>
  </circle>
  <text x="450" y="252" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#8B949E">CORE</text>

  <!-- technology stars (cyan = languages, magenta = frameworks, purple = infra, gold = AI) -->
  <g font-family="'Courier New', monospace" font-size="12" text-anchor="middle">
    <g>
      <circle cx="180" cy="120" r="5" fill="#00F5FF" filter="url(#starGlow)">
        <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="180" y="104" fill="#00F5FF">Python</text>
    </g>
    <g>
      <circle cx="330" cy="90" r="5" fill="#00F5FF" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="330" y="74" fill="#00F5FF">TypeScript</text>
    </g>
    <g>
      <circle cx="620" cy="110" r="5" fill="#FF00E5" filter="url(#starGlow)">
        <animate attributeName="opacity" values="1;0.4;1" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <text x="620" y="94" fill="#FF00E5">React</text>
    </g>
    <g>
      <circle cx="770" cy="140" r="5" fill="#FF00E5" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text x="770" y="124" fill="#FF00E5">Node.js</text>
    </g>
    <g>
      <circle cx="700" cy="280" r="5" fill="#9D4EDD" filter="url(#starGlow)">
        <animate attributeName="opacity" values="1;0.4;1" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <text x="700" y="302" fill="#9D4EDD">Docker</text>
    </g>
    <g>
      <circle cx="560" cy="340" r="5" fill="#9D4EDD" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="560" y="362" fill="#9D4EDD">Kubernetes</text>
    </g>
    <g>
      <circle cx="310" cy="300" r="6" fill="#FFD700" filter="url(#starGlow)">
        <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="310" y="322" fill="#FFD700">PyTorch</text>
    </g>
    <g>
      <circle cx="130" cy="250" r="6" fill="#FFD700" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="130" y="272" fill="#FFD700">LLMs</text>
    </g>
  </g>

  <!-- signal pulses along key edges -->
  <circle r="2" fill="#00F5FF">
    <animateMotion path="M 450 210 L 180 120" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#FFD700">
    <animateMotion path="M 450 210 L 310 300" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#FF00E5">
    <animateMotion path="M 450 210 L 620 110" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#9D4EDD">
    <animateMotion path="M 450 210 L 700 280" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- legend -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#8B949E">
    <circle cx="70" cy="398" r="3" fill="#00F5FF"/><text x="80" y="402">Languages</text>
    <circle cx="200" cy="398" r="3" fill="#FF00E5"/><text x="210" y="402">Frameworks</text>
    <circle cx="340" cy="398" r="3" fill="#9D4EDD"/><text x="350" y="402">Infrastructure</text>
    <circle cx="510" cy="398" r="3" fill="#FFD700"/><text x="520" y="402">AI / ML</text>
    <text x="830" y="402" text-anchor="end" fill="#484F58">est. in the void</text>
  </g>
</svg>
