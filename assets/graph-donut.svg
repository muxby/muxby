<svg xmlns="http://www.w3.org/2000/svg" width="440" height="420" viewBox="0 0 440 420" role="img" aria-label="Code DNA donut chart">
  <defs>
    <filter id="dGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="440" height="420" rx="16" fill="#0D1117" stroke="#30363D"/>
  <text x="220" y="34" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" letter-spacing="5" fill="#8B949E">🧬 CODE DNA — SEQUENCED</text>

  <!-- donut: center (220,190), r=95, pathLength=100 per ring; segments drawn as dash slices -->
  <!-- track -->
  <circle cx="220" cy="190" r="95" fill="none" stroke="#161B22" stroke-width="30"/>

  <!-- Python 34% (starts at 12 o'clock) -->
  <circle cx="220" cy="190" r="95" fill="none" stroke="#00F5FF" stroke-width="30" pathLength="100"
          stroke-dasharray="33 67" transform="rotate(-90 220 190)" filter="url(#dGlow)">
    <animate attributeName="stroke-dasharray" values="0 100;33 67" dur="1.2s" fill="freeze"/>
  </circle>
  <!-- TypeScript 26% -->
  <circle cx="220" cy="190" r="95" fill="none" stroke="#FF00E5" stroke-width="30" pathLength="100"
          stroke-dasharray="25 75" transform="rotate(32.4 220 190)" filter="url(#dGlow)">
    <animate attributeName="stroke-dasharray" values="0 100;25 75" dur="1.2s" begin="0.5s" fill="freeze"/>
  </circle>
  <!-- Go 14% -->
  <circle cx="220" cy="190" r="95" fill="none" stroke="#9D4EDD" stroke-width="30" pathLength="100"
          stroke-dasharray="13 87" transform="rotate(126 220 190)" filter="url(#dGlow)">
    <animate attributeName="stroke-dasharray" values="0 100;13 87" dur="1s" begin="1s" fill="freeze"/>
  </circle>
  <!-- Rust 6% -->
  <circle cx="220" cy="190" r="95" fill="none" stroke="#FFD700" stroke-width="30" pathLength="100"
          stroke-dasharray="5 95" transform="rotate(176.4 220 190)" filter="url(#dGlow)">
    <animate attributeName="stroke-dasharray" values="0 100;5 95" dur="0.8s" begin="1.4s" fill="freeze"/>
  </circle>
  <!-- Everything else 20% -->
  <circle cx="220" cy="190" r="95" fill="none" stroke="#30363D" stroke-width="30" pathLength="100"
          stroke-dasharray="19 81" transform="rotate(198 220 190)">
    <animate attributeName="stroke-dasharray" values="0 100;19 81" dur="1s" begin="1.7s" fill="freeze"/>
  </circle>

  <!-- rotating scanner ring -->
  <circle cx="220" cy="190" r="118" fill="none" stroke="#00F5FF" stroke-width="1" stroke-dasharray="2 14" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="0 220 190" to="360 220 190" dur="20s" repeatCount="indefinite"/>
  </circle>

  <!-- center readout -->
  <text x="220" y="182" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" letter-spacing="3" fill="#8B949E">SAMPLE</text>
  <text x="220" y="206" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#E6EDF3">1.2M LOC</text>
  <text x="220" y="226" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#3FB950">
    ● ANALYZING
    <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
  </text>

  <!-- legend -->
  <g font-family="'Courier New', monospace" font-size="12">
    <rect x="46" y="330" width="10" height="10" rx="2" fill="#00F5FF"/><text x="62" y="340" fill="#E6EDF3">Python 34%</text>
    <rect x="176" y="330" width="10" height="10" rx="2" fill="#FF00E5"/><text x="192" y="340" fill="#E6EDF3">TypeScript 26%</text>
    <rect x="330" y="330" width="10" height="10" rx="2" fill="#9D4EDD"/><text x="346" y="340" fill="#E6EDF3">Go 14%</text>
    <rect x="46" y="356" width="10" height="10" rx="2" fill="#FFD700"/><text x="62" y="366" fill="#E6EDF3">Rust 6%</text>
    <rect x="176" y="356" width="10" height="10" rx="2" fill="#30363D"/><text x="192" y="366" fill="#8B949E">everything else 20%</text>
  </g>
  <text x="220" y="398" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#484F58">no genome was harmed during sequencing</text>
</svg>
