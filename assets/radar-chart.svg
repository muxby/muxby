<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img" aria-labelledby="title desc">
  <title id="title">Desk with a polaroid</title>
  <desc id="desc">A walnut desk at night: a brass lamp, an open notebook, and an ivory polaroid of a tiny dragon.</desc>
  <defs>
    <radialGradient id="lampGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#EDAE49" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#E2703A" stop-opacity=".2"/>
      <stop offset="1" stop-color="#E2703A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="520" height="320" fill="#16202E"/>
  <ellipse cx="308" cy="120" rx="150" ry="120" fill="url(#lampGlow)">
    <animate attributeName="opacity" values=".7;1;.7" dur="3.6s" repeatCount="indefinite"/>
  </ellipse>
  <rect x="0" y="210" width="520" height="110" fill="#2B2620"/>
  <rect x="0" y="210" width="520" height="10" fill="#8C7442"/>
  <rect x="40" y="48" width="220" height="250" fill="#F0EADC" stroke="#8C7442" stroke-width="2"/>
  <rect x="58" y="66" width="184" height="150" fill="#22303F"/>
  <rect x="110" y="118" width="70" height="50" fill="#C45C32"/>
  <rect x="124" y="128" width="16" height="12" fill="#FBF6E9"/>
  <rect x="148" y="128" width="16" height="12" fill="#FBF6E9"/>
  <rect x="132" y="148" width="40" height="18" fill="#EDAE49"/>
  <text x="150" y="236" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#22303F">first useful spark</text>
  <rect x="300" y="88" width="16" height="122" fill="#8C7442"/>
  <path d="M292 88 Q308 64 324 88" fill="#C8A868" stroke="#8C7442" stroke-width="3"/>
  <ellipse cx="308" cy="76" rx="26" ry="18" fill="#EDAE49" opacity=".65">
    <animate attributeName="opacity" values=".45;.85;.45" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <rect x="340" y="168" width="150" height="42" fill="#DFD5C1"/>
  <rect x="352" y="178" width="90" height="6" fill="#8C7442"/>
  <rect x="352" y="190" width="110" height="6" fill="#8C7442"/>
  <text x="260" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#C8A868">the desk, not the cockpit</text>
</svg>
