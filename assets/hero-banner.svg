<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="MUXBY — animated nebula hero banner">
  <defs>
    <!-- ── Animated nebula gradient ─────────────────────────────── -->
    <linearGradient id="nebula" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF">
        <animate attributeName="stop-color" values="#00F5FF;#9D4EDD;#FF00E5;#00F5FF" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#9D4EDD">
        <animate attributeName="stop-color" values="#9D4EDD;#FF00E5;#00F5FF;#9D4EDD" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF00E5">
        <animate attributeName="stop-color" values="#FF00E5;#00F5FF;#9D4EDD;#FF00E5" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glowCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9D4EDD" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#1B1035" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanCloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="magentaCloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF00E5" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF00E5" stop-opacity="0"/>
    </radialGradient>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Deep space backdrop ──────────────────────────────────── -->
  <rect width="1200" height="380" fill="#0D1117"/>
  <rect width="1200" height="380" fill="url(#glowCore)"/>

  <!-- drifting nebula clouds -->
  <ellipse cx="260" cy="120" rx="340" ry="150" fill="url(#cyanCloud)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 60 20; 0 0" dur="18s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="960" cy="260" rx="360" ry="160" fill="url(#magentaCloud)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -70 -25; 0 0" dur="22s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ── Star field (twinkling) ───────────────────────────────── -->
  <g fill="#E6EDF3">
    <circle cx="80"  cy="60"  r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s"   repeatCount="indefinite"/></circle>
    <circle cx="180" cy="300" r="1.2"><animate attributeName="opacity" values="1;0.15;1"  dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="90"  r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="330" r="1.1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="50"  r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="320" r="1.7"><animate attributeName="opacity" values="1;0.25;1"  dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="70"  r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="310" r="1.5"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="90"  r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="50" r="1.7"><animate attributeName="opacity" values="1;0.3;1"  dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="290" r="1.2"><animate attributeName="opacity" values="0.25;1;0.25" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="60"  cy="220" r="1.1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- shooting star -->
  <g>
    <line x1="0" y1="0" x2="60" y2="18" stroke="#00F5FF" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <animateMotion path="M 1250 30 L 750 160" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ── Orbiting geometry (left) ─────────────────────────────── -->
  <g transform="translate(180,190)">
    <circle r="72" fill="none" stroke="#00F5FF" stroke-opacity="0.25" stroke-dasharray="4 6"/>
    <circle r="104" fill="none" stroke="#FF00E5" stroke-opacity="0.18" stroke-dasharray="2 8"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      <polygon points="72,-7 79,5 65,5" fill="#00F5FF" filter="url(#softGlow)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
      <rect x="98" y="-6" width="12" height="12" rx="2" fill="#FF00E5" filter="url(#softGlow)"/>
    </g>
    <polygon points="0,-26 23,-13 23,13 0,26 -23,13 -23,-13" fill="none" stroke="url(#nebula)" stroke-width="2" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- ── Orbiting geometry (right) ────────────────────────────── -->
  <g transform="translate(1020,190)">
    <circle r="72" fill="none" stroke="#FF00E5" stroke-opacity="0.25" stroke-dasharray="4 6"/>
    <circle r="104" fill="none" stroke="#00F5FF" stroke-opacity="0.18" stroke-dasharray="2 8"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="16s" repeatCount="indefinite"/>
      <circle cx="72" cy="0" r="6" fill="#9D4EDD" filter="url(#softGlow)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="90" to="-270" dur="24s" repeatCount="indefinite"/>
      <polygon points="104,-8 112,0 104,8 96,0" fill="#FFD700" filter="url(#softGlow)"/>
    </g>
    <polygon points="0,-26 23,-13 23,13 0,26 -23,13 -23,-13" fill="none" stroke="url(#nebula)" stroke-width="2" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- ── Name materializing ───────────────────────────────────── -->
  <text x="600" y="185" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="86" font-weight="800" letter-spacing="26" fill="url(#nebula)" filter="url(#neonGlow)">
    MUXBY
    <animate attributeName="opacity" values="0;1" dur="2.4s" fill="freeze"/>
  </text>
  <text x="600" y="235" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="17" letter-spacing="10" fill="#8B949E">
    C R E A T I V E &#160; S O F T W A R E &#160; E N G I N E E R
    <animate attributeName="opacity" values="0;0;1" dur="3.2s" fill="freeze"/>
  </text>

  <!-- underline beam -->
  <rect x="380" y="255" width="440" height="2" rx="1" fill="url(#nebula)" opacity="0.9">
    <animate attributeName="width" values="0;440" dur="2.8s" fill="freeze"/>
    <animate attributeName="x" values="600;380" dur="2.8s" fill="freeze"/>
  </rect>

  <!-- status line -->
  <g font-family="'Courier New', monospace" font-size="13">
    <circle cx="497" cy="292" r="4" fill="#3FB950">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="510" y="297" fill="#3FB950" letter-spacing="3">SYSTEM ONLINE — BUILDING THE FUTURE</text>
  </g>

  <!-- bottom scanline shimmer -->
  <rect x="0" y="374" width="1200" height="6" fill="url(#nebula)" opacity="0.65">
    <animate attributeName="opacity" values="0.65;0.25;0.65" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
