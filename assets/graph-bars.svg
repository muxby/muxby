<svg xmlns="http://www.w3.org/2000/svg" width="440" height="420" viewBox="0 0 440 420" role="img" aria-label="Skill equalizer bar chart">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6E7681"/>
      <stop offset="60%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#79C0FF"/>
    </linearGradient>
    <filter id="bGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="440" height="420" rx="16" fill="#0D1117" stroke="#30363D"/>
  <text x="220" y="34" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" letter-spacing="5" fill="#8B949E"> REPOSITORY COVERAGE — 30 REPOS</text>

  <!-- grid lines: baseline y=330, 100% at y=90 (240px range) -->
  <g stroke="#21262D" stroke-width="1">
    <line x1="40" y1="90"  x2="400" y2="90"/>
    <line x1="40" y1="150" x2="400" y2="150"/>
    <line x1="40" y1="210" x2="400" y2="210"/>
    <line x1="40" y1="270" x2="400" y2="270"/>
    <line x1="40" y1="330" x2="400" y2="330"/>
  </g>
  <g font-family="'Courier New', monospace" font-size="9" fill="#484F58">
    <text x="36" y="94"  text-anchor="end">100</text>
    <text x="36" y="154" text-anchor="end">75</text>
    <text x="36" y="214" text-anchor="end">50</text>
    <text x="36" y="274" text-anchor="end">25</text>
  </g>

  <!-- bars: width 30, gap ~14. rise once, then breathe like an EQ -->
  <!-- PY 33% → h=79, y=251 -->
  <rect x="52" width="30" rx="4" fill="url(#barGrad)" filter="url(#bGlow)" y="251" height="79">
    <animate attributeName="y"      values="330;251" dur="1.2s" fill="freeze"/>
    <animate attributeName="height" values="0;79"   dur="1.2s" fill="freeze"/>
    <animate attributeName="y"      values="251;259;251" dur="2.6s" begin="1.4s" repeatCount="indefinite"/>
    <animate attributeName="height" values="79;71;79" dur="2.6s" begin="1.4s" repeatCount="indefinite"/>
  </rect>
  <!-- TS 37% → h=89, y=241 -->
  <rect x="96" width="30" rx="4" fill="url(#barGrad)" filter="url(#bGlow)" y="241" height="89">
    <animate attributeName="y"      values="330;241" dur="1.2s" begin="0.15s" fill="freeze"/>
    <animate attributeName="height" values="0;89"   dur="1.2s" begin="0.15s" fill="freeze"/>
    <animate attributeName="y"      values="241;251;241" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="height" values="89;79;89" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </rect>
  <!-- AI 57% → h=137, y=193 -->
  <rect x="140" width="30" rx="4" fill="url(#barGrad)" filter="url(#bGlow)" y="193" height="137">
    <animate attributeName="y"      values="330;193" dur="1.2s" begin="0.3s" fill="freeze"/>
    <animate attributeName="height" values="0;137"   dur="1.2s" begin="0.3s" fill="freeze"/>
    <animate attributeName="y"      values="193;201;193" dur="2.2s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="height" values="137;129;137" dur="2.2s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
  <!-- API 70% → h=168, y=162 -->
  <rect x="184" width="30" rx="4" fill="url(#barGrad)" filter="url(#bGlow)" y="162" height="168">
    <animate attributeName="y"      values="330;162" dur="1.2s" begin="0.45s" fill="freeze"/>
    <animate attributeName="height" values="0;168"   dur="1.2s" begin="0.45s" fill="freeze"/>
    <animate attributeName="y"      values="162;172;162" dur="2.8s" begin="1.7s" repeatCount="indefinite"/>
    <animate attributeName="height" values="168;158;168" dur="2.8s" begin="1.7s" repeatCount="indefinite"/>
  </rect>
  <!-- DB 43% → h=103, y=227 -->
  <rect x="228" width="30" rx="4" fill="url(#barGrad)" filter="url(#bGlow)" y="227" height="103">
    <animate attributeName="y"      values="330;227" dur="1.2s" begin="0.6s" fill="freeze"/>
    <animate attributeName="height" values="0;103"   dur="1.2s" begin="0.6s" fill="freeze"/>
    <animate attributeName="y"      values="227;235;227" dur="3.4s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="height" values="103;95;103" dur="3.4s" begin="1.8s" repeatCount="indefinite"/>
  </rect>
  <!-- OPS 60% → h=144, y=186 -->
  <rect x="272" width="30" rx="4" fill="url(#barGrad)" filter="url(#bGlow)" y="186" height="144">
    <animate attributeName="y"      values="330;186" dur="1.2s" begin="0.75s" fill="freeze"/>
    <animate attributeName="height" values="0;144"   dur="1.2s" begin="0.75s" fill="freeze"/>
    <animate attributeName="y"      values="186;196;186" dur="2.4s" begin="1.9s" repeatCount="indefinite"/>
    <animate attributeName="height" values="144;134;144" dur="2.4s" begin="1.9s" repeatCount="indefinite"/>
  </rect>
  <!-- UI 67% → h=161, y=169 -->
  <rect x="316" width="30" rx="4" fill="url(#barGrad)" filter="url(#bGlow)" y="169" height="161">
    <animate attributeName="y"      values="330;169" dur="1.2s" begin="0.9s" fill="freeze"/>
    <animate attributeName="height" values="0;161"   dur="1.2s" begin="0.9s" fill="freeze"/>
    <animate attributeName="y"      values="169;179;169" dur="3.1s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="height" values="161;151;161" dur="3.1s" begin="2s" repeatCount="indefinite"/>
  </rect>
  <!-- SEC 43% → h=103, y=227 -->
  <rect x="360" width="30" rx="4" fill="url(#barGrad)" filter="url(#bGlow)" y="227" height="103">
    <animate attributeName="y"      values="330;227" dur="1.2s" begin="1.05s" fill="freeze"/>
    <animate attributeName="height" values="0;103"   dur="1.2s" begin="1.05s" fill="freeze"/>
    <animate attributeName="y"      values="227;237;227" dur="2.7s" begin="2.1s" repeatCount="indefinite"/>
    <animate attributeName="height" values="103;93;103" dur="2.7s" begin="2.1s" repeatCount="indefinite"/>
  </rect>

  <!-- peak-hold caps -->
  <g fill="#D0D7DE">
    <rect x="52"  y="96"  width="30" height="3" rx="1.5"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.2s" fill="freeze"/></rect>
    <rect x="140" y="103" width="30" height="3" rx="1.5"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s" fill="freeze"/></rect>
  </g>

  <!-- baseline -->
  <line x1="40" y1="330" x2="400" y2="330" stroke="#30363D" stroke-width="2"/>

  <!-- labels -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#8B949E" text-anchor="middle">
    <text x="67"  y="350">PY</text>
    <text x="111" y="350">TS</text>
    <text x="155" y="350">AI</text>
    <text x="199" y="350">API</text>
    <text x="243" y="350">DB</text>
    <text x="287" y="350">OPS</text>
    <text x="331" y="350">UI</text>
    <text x="375" y="350">SEC</text>
  </g>
  <g font-family="'Courier New', monospace" font-size="10" fill="#58A6FF" text-anchor="middle">
    <text x="67"  y="366">33</text>
    <text x="111" y="366">37</text>
    <text x="155" y="366">57</text>
    <text x="199" y="366">70</text>
    <text x="243" y="366">43</text>
    <text x="287" y="366">60</text>
    <text x="331" y="366">67</text>
    <text x="375" y="366">43</text>
  </g>
  <text x="220" y="398" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#484F58">coverage = repositories containing the category</text>
</svg>
