<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Muxby — creative software engineer</title>
  <desc id="desc">A restrained animated graphite and navy editorial banner with bronze architectural lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="0.55" stop-color="#111b25"/>
      <stop offset="1" stop-color="#0a0f15"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f6d43" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#d4b27a" stop-opacity=".95"/>
      <stop offset="1" stop-color="#8f6d43" stop-opacity=".45"/>
      <animate attributeName="x1" values="0;0.18;0" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0.82;1" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="wash" cx="50%" cy="42%" r="68%">
      <stop offset="0" stop-color="#31495a" stop-opacity=".22"/>
      <stop offset=".7" stop-color="#142230" stop-opacity=".08"/>
      <stop offset="1" stop-color="#070b10" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#wash)"/>

  <!-- Quiet atmospheric movement: one slow, low-opacity wash. -->
  <ellipse cx="610" cy="175" rx="330" ry="135" fill="#4b6578" opacity=".055" filter="url(#soft)">
    <animateTransform attributeName="transform" type="translate" values="0 0;18 -4;0 0" dur="24s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Architectural framing, intentionally sparse and static. -->
  <g fill="none" stroke="url(#bronze)" stroke-width="1">
    <path d="M0 290 L154 290 L238 206 L238 0" opacity=".64"/>
    <path d="M0 324 L170 324 L272 222 L272 0" opacity=".22"/>
    <path d="M1200 48 L1098 48 L1010 136 L1010 380" opacity=".54"/>
    <path d="M1200 16 L1120 16 L1040 96 L1040 380" opacity=".2"/>
    <path d="M0 340 H420" opacity=".25"/>
    <path d="M780 340 H1200" opacity=".25"/>
  </g>

  <g fill="#d4b27a" opacity=".7">
    <circle cx="238" cy="206" r="2"/>
    <circle cx="1010" cy="136" r="2"/>
    <circle cx="1098" cy="48" r="2"/>
  </g>

  <!-- Subtle points of light; low count avoids render overhead. -->
  <g fill="#b9c8d2">
    <circle cx="145" cy="82" r="1" opacity=".4"/>
    <circle cx="332" cy="48" r="1" opacity=".28"/>
    <circle cx="872" cy="66" r="1" opacity=".32"/>
    <circle cx="1045" cy="278" r="1" opacity=".36"/>
    <circle cx="712" cy="318" r="1" opacity=".25"/>
  </g>

  <!-- Restrained animated accent line. -->
  <path d="M420 292 H780" stroke="url(#bronze)" stroke-width="2" stroke-linecap="round" opacity=".72" stroke-dasharray="28 332">
    <animate attributeName="stroke-dashoffset" values="0;-360;0" dur="12s" repeatCount="indefinite"/>
  </path>

  <g text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="600" y="172" fill="#e6edf3" font-size="54" font-weight="700" letter-spacing="15">MUBEEN</text>
    <text x="600" y="212" fill="#aebdca" font-size="14" letter-spacing="5">CREATIVE SOFTWARE ENGINEER · AI DEVELOPER</text>
    <text x="600" y="252" fill="#d4b27a" font-family="Georgia, serif" font-size="15" font-style="italic">Thoughtful systems, useful intelligence, durable craft.</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8fa2b2" letter-spacing="2">
    <text x="42" y="348">BUILD WITH CLARITY</text>
    <text x="1158" y="348" text-anchor="end">DESIGN FOR CHANGE</text>
  </g>
</svg>
