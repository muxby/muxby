<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Muxby — creative software engineer</title>
  <desc id="desc">A visibly animated but lightweight editorial banner with graphite, navy, bronze, and steel-blue architectural motion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080e15"/>
      <stop offset=".52" stop-color="#142331"/>
      <stop offset="1" stop-color="#090e14"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#88653d" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#d9b67b" stop-opacity="1"/>
      <stop offset="1" stop-color="#88653d" stop-opacity=".28"/>
      <animate attributeName="x1" values="0;.35;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;.65;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="atmosphere" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#7592a8" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#263e50" stop-opacity=".08"/>
      <stop offset="1" stop-color="#070b10" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#atmosphere)">
    <animate attributeName="opacity" values=".55;1;.55" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Slow ambient movement makes the banner visibly alive without raster frames. -->
  <ellipse cx="600" cy="174" rx="310" ry="120" fill="#6a879b" opacity=".06" filter="url(#soft)">
    <animateTransform attributeName="transform" type="translate" values="-18 2;18 -3;-18 2" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".035;.11;.035" dur="16s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Framing architecture subtly shifts over time. -->
  <g fill="none" stroke="url(#bronze)" stroke-width="1">
    <path d="M0 290 L154 290 L238 206 L238 0" opacity=".72">
      <animateTransform attributeName="transform" type="translate" values="0 0;9 -3;0 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M0 324 L170 324 L272 222 L272 0" opacity=".3">
      <animateTransform attributeName="transform" type="translate" values="0 0;-6 2;0 0" dur="15s" repeatCount="indefinite"/>
    </path>
    <path d="M1200 48 L1098 48 L1010 136 L1010 380" opacity=".62">
      <animateTransform attributeName="transform" type="translate" values="0 0;-8 2;0 0" dur="13s" repeatCount="indefinite"/>
    </path>
    <path d="M1200 16 L1120 16 L1040 96 L1040 380" opacity=".28">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 -2;0 0" dur="17s" repeatCount="indefinite"/>
    </path>
    <path d="M0 340 H420" opacity=".28"/>
    <path d="M780 340 H1200" opacity=".28"/>
  </g>

  <!-- Traveling light points create a clear but restrained motion cue. -->
  <g fill="#d9b67b" filter="url(#glow)">
    <circle cx="238" cy="206" r="2"><animate attributeName="r" values="1.5;4;1.5" dur="3.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;1;.35" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="136" r="2"><animate attributeName="r" values="1.5;4;1.5" dur="4.6s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values=".25;1;.25" dur="4.6s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="#b9c8d2">
    <circle cx="145" cy="82" r="1" opacity=".3"><animate attributeName="opacity" values=".15;.8;.15" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="332" cy="48" r="1" opacity=".25"><animate attributeName="opacity" values=".15;.65;.15" dur="6.5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="872" cy="66" r="1" opacity=".3"><animate attributeName="opacity" values=".15;.75;.15" dur="5.5s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="1045" cy="278" r="1" opacity=".3"><animate attributeName="opacity" values=".15;.7;.15" dur="7s" begin=".5s" repeatCount="indefinite"/></circle>
    <circle cx="712" cy="318" r="1" opacity=".25"><animate attributeName="opacity" values=".1;.6;.1" dur="6s" begin="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- A visibly traveling bronze signal line. -->
  <path d="M380 292 H820" stroke="#9a774a" stroke-width="1" opacity=".28"/>
  <path d="M380 292 H820" stroke="url(#bronze)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="38 402" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-440;0" dur="6s" repeatCount="indefinite"/>
  </path>

  <g text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="600" y="172" fill="#e6edf3" font-size="54" font-weight="700" letter-spacing="15">MUBEEN</text>
    <text x="600" y="212" fill="#b1c0cb" font-size="14" letter-spacing="5">CREATIVE SOFTWARE ENGINEER · AI DEVELOPER</text>
    <text x="600" y="252" fill="#d9b67b" font-family="Georgia, serif" font-size="15" font-style="italic">Thoughtful systems, useful intelligence, durable craft.</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8fa2b2" letter-spacing="2">
    <text x="42" y="348">BUILD WITH CLARITY</text>
    <text x="1158" y="348" text-anchor="end">DESIGN FOR CHANGE</text>
  </g>
</svg>
