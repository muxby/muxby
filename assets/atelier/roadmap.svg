<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Roadmap</title>
  <desc id="desc">A lantern-lit roadmap across a twilight sky. Brass marks the ground already covered, amber marks where the work is now, and faint sage marks what comes next.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141D2B"/>
      <stop offset=".55" stop-color="#1B2738"/>
      <stop offset="1" stop-color="#16202E"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C7442"/>
      <stop offset=".5" stop-color="#C8A868"/>
      <stop offset="1" stop-color="#C8A868"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#EDAE49" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#E2703A" stop-opacity=".16"/>
      <stop offset="1" stop-color="#E2703A" stop-opacity="0"/>
    </radialGradient>
    <filter id="plaque" x="-8%" y="-20%" width="116%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B121C" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="url(#night)"/>

  <!-- distant hills keep it a garden, not a grid -->
  <path d="M0 366 C 180 330, 360 352, 560 344 C 760 336, 940 318, 1200 340 L1200 520 L0 520 Z" fill="#1F2E36" opacity=".85"/>
  <path d="M0 410 C 220 384, 420 404, 640 396 C 860 388, 1020 400, 1200 386 L1200 520 L0 520 Z" fill="#25353A"/>

  <g fill="#F0EADC">
    <circle cx="120" cy="72" r="1.6" opacity=".5"><animate attributeName="opacity" values=".25;.8;.25" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="52" r="1.2" opacity=".4"><animate attributeName="opacity" values=".6;.2;.6" dur="5.4s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="66" r="1.4" opacity=".45"><animate attributeName="opacity" values=".2;.75;.2" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="48" r="1.2" opacity=".4"><animate attributeName="opacity" values=".7;.25;.7" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="80" r="1.6" opacity=".5"><animate attributeName="opacity" values=".3;.85;.3" dur="5s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="1096" cy="96" r="26" fill="#FBF6E9" opacity=".14"/>
  <circle cx="1096" cy="96" r="18" fill="#FBF6E9" opacity=".22"/>

  <text x="600" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#F0EADC" letter-spacing="6">ROADMAP</text>
  <text x="600" y="78" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#C8A868">a direction of travel, kept honest</text>

  <!-- rail -->
  <path d="M70 300 H730" stroke="url(#rail)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M730 300 H890" stroke="#EDAE49" stroke-width="5" stroke-linecap="round" fill="none" stroke-dasharray="12 10">
    <animate attributeName="stroke-dashoffset" values="0;-44" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <path d="M890 300 H1130" stroke="#7E9A72" stroke-width="4" stroke-linecap="round" fill="none" stroke-dasharray="3 11" opacity=".7"/>

  <!-- lantern glow at the current station -->
  <ellipse cx="730" cy="300" rx="120" ry="86" fill="url(#glow)">
    <animate attributeName="opacity" values=".55;1;.55" dur="3.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- connector stems -->
  <g stroke="#C8A868" stroke-width="1.5" opacity=".55">
    <path d="M90 300 V254"/>
    <path d="M250 300 V346"/>
    <path d="M410 300 V254"/>
    <path d="M570 300 V346"/>
    <path d="M730 300 V240"/>
    <path d="M890 300 V346"/>
    <path d="M1050 300 V254"/>
  </g>

  <!-- plaques -->
  <g font-family="Georgia, 'Times New Roman', serif" filter="url(#plaque)">
    <g>
      <rect x="20" y="200" width="140" height="54" rx="4" fill="#F0EADC"/>
      <text x="90" y="224" text-anchor="middle" font-size="14" fill="#22303F">Fundamentals</text>
      <text x="90" y="243" text-anchor="middle" font-size="11" fill="#5C6B78">C, C++, the basics</text>
    </g>
    <g>
      <rect x="180" y="346" width="140" height="54" rx="4" fill="#F0EADC"/>
      <text x="250" y="370" text-anchor="middle" font-size="14" fill="#22303F">Web platform</text>
      <text x="250" y="389" text-anchor="middle" font-size="11" fill="#5C6B78">React, Next.js, PHP</text>
    </g>
    <g>
      <rect x="340" y="200" width="140" height="54" rx="4" fill="#F0EADC"/>
      <text x="410" y="224" text-anchor="middle" font-size="14" fill="#22303F">Backends</text>
      <text x="410" y="243" text-anchor="middle" font-size="11" fill="#5C6B78">APIs, Postgres, queues</text>
    </g>
    <g>
      <rect x="500" y="346" width="140" height="54" rx="4" fill="#F0EADC"/>
      <text x="570" y="370" text-anchor="middle" font-size="14" fill="#22303F">Cloud</text>
      <text x="570" y="389" text-anchor="middle" font-size="11" fill="#5C6B78">Docker, AWS, CI</text>
    </g>
    <g>
      <rect x="646" y="176" width="168" height="64" rx="4" fill="#FBF6E9" stroke="#EDAE49" stroke-width="2"/>
      <text x="730" y="200" text-anchor="middle" font-size="15" fill="#22303F">Agentic systems</text>
      <text x="730" y="220" text-anchor="middle" font-size="11" fill="#5C6B78">review loops, tools, evals</text>
      <text x="730" y="234" text-anchor="middle" font-size="10" fill="#B4472A" letter-spacing="1">YOU ARE HERE</text>
    </g>
    <g>
      <rect x="820" y="346" width="140" height="54" rx="4" fill="#DFD5C1"/>
      <text x="890" y="370" text-anchor="middle" font-size="14" fill="#22303F">Rust</text>
      <text x="890" y="389" text-anchor="middle" font-size="11" fill="#5C6B78">next: ship one CLI</text>
    </g>
    <g>
      <rect x="980" y="200" width="140" height="54" rx="4" fill="#DFD5C1" opacity=".9"/>
      <text x="1050" y="224" text-anchor="middle" font-size="14" fill="#22303F">Distributed</text>
      <text x="1050" y="243" text-anchor="middle" font-size="11" fill="#5C6B78">later: read the papers</text>
    </g>
  </g>

  <!-- stations -->
  <g>
    <circle cx="90" cy="300" r="9" fill="#C8A868" stroke="#141D2B" stroke-width="3"/>
    <circle cx="250" cy="300" r="9" fill="#C8A868" stroke="#141D2B" stroke-width="3"/>
    <circle cx="410" cy="300" r="9" fill="#C8A868" stroke="#141D2B" stroke-width="3"/>
    <circle cx="570" cy="300" r="9" fill="#C8A868" stroke="#141D2B" stroke-width="3"/>
    <circle cx="730" cy="300" r="12" fill="#EDAE49" stroke="#141D2B" stroke-width="3">
      <animate attributeName="r" values="11;14;11" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="730" cy="300" r="12" fill="none" stroke="#EDAE49" stroke-width="1.5">
      <animate attributeName="r" values="12;30" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="890" cy="300" r="9" fill="#1B2738" stroke="#7E9A72" stroke-width="3"/>
    <circle cx="1050" cy="300" r="9" fill="#1B2738" stroke="#4C6650" stroke-width="3"/>
  </g>

  <!-- horizon marker -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <path d="M1130 300 L1160 300" stroke="#4C6650" stroke-width="3" stroke-linecap="round"/>
    <text x="1166" y="292" font-size="11" fill="#7E9A72">the</text>
    <text x="1166" y="306" font-size="11" fill="#7E9A72">long</text>
    <text x="1166" y="320" font-size="11" fill="#7E9A72">run</text>
  </g>

  <!-- legend -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#DFD5C1">
    <circle cx="300" cy="462" r="7" fill="#C8A868"/>
    <text x="316" y="466">walked</text>
    <circle cx="440" cy="462" r="7" fill="#EDAE49"/>
    <text x="456" y="466">working on it</text>
    <circle cx="620" cy="462" r="7" fill="#1B2738" stroke="#7E9A72" stroke-width="2.5"/>
    <text x="636" y="466">next</text>
    <circle cx="740" cy="462" r="7" fill="#1B2738" stroke="#4C6650" stroke-width="2.5"/>
    <text x="756" y="466">later</text>
  </g>
</svg>
