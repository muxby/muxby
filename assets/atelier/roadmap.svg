<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision">
  <title id="title">Roadmap</title>
  <desc id="desc">A forge-lit roadmap on graphite. Brass marks ground already covered, gold marks the work in hand, and patina marks what comes next.</desc>
  <defs>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1013"/>
      <stop offset=".55" stop-color="#1B1D23"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="rail" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="1130" y2="0">
      <stop offset="0" stop-color="#8A6E1F"/>
      <stop offset=".55" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#E0B94A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F2C14E" stop-opacity=".42"/>
      <stop offset=".5" stop-color="#E4572E" stop-opacity=".14"/>
      <stop offset="1" stop-color="#E4572E" stop-opacity="0"/>
    </radialGradient>
    <filter id="plaque" x="-8%" y="-24%" width="116%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="url(#deck)"/>

  <!-- low ridges: cool secondary, kept almost monochrome -->
  <path d="M0 366 C 180 330, 360 352, 560 344 C 760 336, 940 318, 1200 340 L1200 520 L0 520 Z" fill="#1E262A"/>
  <path d="M0 412 C 220 386, 420 406, 640 398 C 860 390, 1020 402, 1200 388 L1200 520 L0 520 Z" fill="#243230"/>

  <g fill="#E9E6DF">
    <circle cx="120" cy="72" r="1.4" opacity=".4"><animate attributeName="opacity" values=".18;.7;.18" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="52" r="1.1" opacity=".32"><animate attributeName="opacity" values=".5;.15;.5" dur="5.4s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="66" r="1.3" opacity=".36"><animate attributeName="opacity" values=".15;.62;.15" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="48" r="1.1" opacity=".32"><animate attributeName="opacity" values=".58;.18;.58" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="80" r="1.4" opacity=".4"><animate attributeName="opacity" values=".22;.72;.22" dur="5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- brass hairline frame -->
  <rect x="18" y="18" width="1164" height="484" fill="none" stroke="#8A6E1F" stroke-width="1" opacity=".55"/>

  <text x="603.6" y="56" text-anchor="middle" font-family="'Noto Serif Display','Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif" font-size="24" letter-spacing="7.2" fill="#E9E6DF">ROADMAP</text>
  <path d="M498 70 H702" stroke="#C9A227" stroke-width="1" opacity=".7"/>
  <text x="601.21" y="92" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="2.42" fill="#9AA0AC">A DIRECTION OF TRAVEL, KEPT HONEST</text>

  <!-- rail -->
  <rect x="70" y="298" width="660" height="4" fill="url(#rail)"/>
  <path d="M730 300 H890" stroke="#F2C14E" stroke-width="4" fill="none" stroke-dasharray="14 8">
    <animate attributeName="stroke-dashoffset" values="0;-44" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <path d="M890 300 H1130" stroke="#6E9C90" stroke-width="3" fill="none" stroke-dasharray="2 10" opacity=".8"/>

  <ellipse cx="730" cy="300" rx="126" ry="90" fill="url(#glow)">
    <animate attributeName="opacity" values=".55;1;.55" dur="3.4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- connector stems -->
  <g stroke="#8A6E1F" stroke-width="1" opacity=".8">
    <path d="M90 300 V254"/>
    <path d="M250 300 V346"/>
    <path d="M410 300 V254"/>
    <path d="M570 300 V346"/>
    <path d="M730 300 V240"/>
    <path d="M890 300 V346"/>
    <path d="M1050 300 V254"/>
  </g>

  <!-- plaques: ink on bone, hard edges -->
  <g filter="url(#plaque)">
    <g>
      <rect x="20" y="200" width="140" height="54" fill="#E9E6DF"/>
      <rect x="20" y="200" width="4" height="54" fill="#C9A227"/>
      <text x="94" y="224" text-anchor="middle" font-size="14" font-weight="500" fill="#1B1D22">Fundamentals</text>
      <text x="94" y="243" text-anchor="middle" font-size="11.5" fill="#4E535D">C, C++, the basics</text>
    </g>
    <g>
      <rect x="180" y="346" width="140" height="54" fill="#E9E6DF"/>
      <rect x="180" y="346" width="4" height="54" fill="#C9A227"/>
      <text x="254" y="370" text-anchor="middle" font-size="14" font-weight="500" fill="#1B1D22">Web platform</text>
      <text x="254" y="389" text-anchor="middle" font-size="11.5" fill="#4E535D">React, Next.js, PHP</text>
    </g>
    <g>
      <rect x="340" y="200" width="140" height="54" fill="#E9E6DF"/>
      <rect x="340" y="200" width="4" height="54" fill="#C9A227"/>
      <text x="414" y="224" text-anchor="middle" font-size="14" font-weight="500" fill="#1B1D22">Backends</text>
      <text x="414" y="243" text-anchor="middle" font-size="11.5" fill="#4E535D">APIs, Postgres, queues</text>
    </g>
    <g>
      <rect x="500" y="346" width="140" height="54" fill="#E9E6DF"/>
      <rect x="500" y="346" width="4" height="54" fill="#C9A227"/>
      <text x="574" y="370" text-anchor="middle" font-size="14" font-weight="500" fill="#1B1D22">Cloud</text>
      <text x="574" y="389" text-anchor="middle" font-size="11.5" fill="#4E535D">Docker, AWS, CI</text>
    </g>
    <g>
      <rect x="646" y="172" width="168" height="68" fill="#F7F5F0"/>
      <rect x="646" y="172" width="168" height="68" fill="none" stroke="#F2C14E" stroke-width="2"/>
      <text x="730" y="196" text-anchor="middle" font-size="15" fill="#1B1D22">Agentic systems</text>
      <text x="730" y="215" text-anchor="middle" font-size="11.5" fill="#4E535D">review loops, tools, evals</text>
      <text x="730.8" y="232" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1.6" fill="#A33418">YOU ARE HERE</text>
    </g>
    <g>
      <rect x="820" y="346" width="140" height="54" fill="#C6C2B8"/>
      <rect x="820" y="346" width="4" height="54" fill="#6E9C90"/>
      <text x="894" y="370" text-anchor="middle" font-size="14" font-weight="500" fill="#1B1D22">Rust</text>
      <text x="894" y="389" text-anchor="middle" font-size="11.5" fill="#4E535D">next: ship one CLI</text>
    </g>
    <g>
      <rect x="980" y="200" width="140" height="54" fill="#C6C2B8"/>
      <rect x="980" y="200" width="4" height="54" fill="#3F6B62"/>
      <text x="1054" y="224" text-anchor="middle" font-size="14" font-weight="500" fill="#1B1D22">Distributed</text>
      <text x="1054" y="243" text-anchor="middle" font-size="11.5" fill="#4E535D">later: read the papers</text>
    </g>
  </g>

  <!-- stations -->
  <g>
    <circle cx="90" cy="300" r="8" fill="#C9A227" stroke="#0F1013" stroke-width="3"/>
    <circle cx="250" cy="300" r="8" fill="#C9A227" stroke="#0F1013" stroke-width="3"/>
    <circle cx="410" cy="300" r="8" fill="#C9A227" stroke="#0F1013" stroke-width="3"/>
    <circle cx="570" cy="300" r="8" fill="#C9A227" stroke="#0F1013" stroke-width="3"/>
    <circle cx="730" cy="300" r="12" fill="#F2C14E" stroke="#0F1013" stroke-width="3">
      <animate attributeName="r" values="11;14;11" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="730" cy="300" r="12" fill="none" stroke="#F2C14E" stroke-width="1.5">
      <animate attributeName="r" values="12;32" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="890" cy="300" r="8" fill="#17181C" stroke="#6E9C90" stroke-width="3"/>
    <circle cx="1050" cy="300" r="8" fill="#17181C" stroke="#3F6B62" stroke-width="3"/>
  </g>

  <!-- horizon marker -->
  <g>
    <path d="M1130 300 L1158 300" stroke="#3F6B62" stroke-width="3"/>
    <text x="1164" y="292" font-size="11.5" fill="#6E9C90">the</text>
    <text x="1164" y="306" font-size="11.5" fill="#6E9C90">long</text>
    <text x="1164" y="320" font-size="11.5" fill="#6E9C90">run</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#C6C2B8">
    <rect x="296" y="456" width="12" height="12" fill="#C9A227"/>
    <text x="318" y="466" font-size="12.5">walked</text>
    <rect x="436" y="456" width="12" height="12" fill="#F2C14E"/>
    <text x="458" y="466" font-size="12.5">working on it</text>
    <rect x="616" y="456" width="12" height="12" fill="#17181C" stroke="#6E9C90" stroke-width="2"/>
    <text x="638" y="466" font-size="12.5">next</text>
    <rect x="736" y="456" width="12" height="12" fill="#17181C" stroke="#3F6B62" stroke-width="2"/>
    <text x="758" y="466" font-size="12.5">later</text>
  </g>
</svg>
