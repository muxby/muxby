<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">The walking trail</title>
  <desc id="desc">The same route as a night walk: lantern-lit signs across sage hills toward a lit cottage, with a small dragon on the path.</desc>
  <defs>
    <linearGradient id="trailSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141D2B"/>
      <stop offset=".6" stop-color="#1E2B3B"/>
      <stop offset="1" stop-color="#26343A"/>
    </linearGradient>
    <radialGradient id="cottageGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#EDAE49" stop-opacity=".5"/>
      <stop offset="1" stop-color="#EDAE49" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="460" fill="url(#trailSky)"/>

  <circle cx="120" cy="72" r="1.6" fill="#F0EADC" opacity=".5"><animate attributeName="opacity" values=".2;.8;.2" dur="4.4s" repeatCount="indefinite"/></circle>
  <circle cx="410" cy="54" r="1.3" fill="#F0EADC" opacity=".45"><animate attributeName="opacity" values=".7;.2;.7" dur="5.2s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="70" r="1.5" fill="#F0EADC" opacity=".5"><animate attributeName="opacity" values=".25;.85;.25" dur="4.8s" repeatCount="indefinite"/></circle>
  <circle cx="905" cy="60" r="18" fill="#FBF6E9" opacity=".2"/>

  <path d="M0 210 C 140 176, 260 196, 400 186 C 560 174, 720 158, 1000 176 L1000 460 L0 460 Z" fill="#22343A" opacity=".9"/>
  <path d="M0 270 C 180 244, 340 264, 520 254 C 700 244, 860 226, 1000 254 L1000 460 L0 460 Z" fill="#2A3E38"/>
  <path d="M0 330 C 160 302, 300 322, 500 312 C 680 302, 840 318, 1000 302 L1000 460 L0 460 Z" fill="#33463A"/>

  <path d="M40 300 C 160 290, 240 310, 340 300 C 460 286, 560 310, 660 300 C 760 288, 860 310, 960 292" fill="none" stroke="#6B5B3E" stroke-width="18" stroke-linecap="round"/>
  <path d="M40 300 C 160 290, 240 310, 340 300 C 460 286, 560 310, 660 300 C 760 288, 860 310, 960 292" fill="none" stroke="#8C7442" stroke-width="8" stroke-linecap="round"/>

  <g fill="#2C4038">
    <polygon points="90,250 110,200 130,250"/>
    <polygon points="820,230 845,170 870,230"/>
    <polygon points="250,240 268,188 286,240"/>
  </g>
  <g fill="#3A3026">
    <rect x="96" y="248" width="8" height="22"/>
    <rect x="838" y="228" width="10" height="26"/>
    <rect x="256" y="238" width="8" height="20"/>
  </g>

  <ellipse cx="895" cy="216" rx="76" ry="56" fill="url(#cottageGlow)">
    <animate attributeName="opacity" values=".6;1;.6" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <rect x="860" y="210" width="70" height="40" fill="#3A3026" stroke="#C8A868" stroke-width="2"/>
  <polygon points="850,210 895,180 940,210" fill="#B4472A"/>
  <rect x="888" y="226" width="14" height="22" fill="#EDAE49">
    <animate attributeName="opacity" values=".75;1;.75" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#22303F">
    <g>
      <rect x="70" y="248" width="10" height="44" fill="#3A3026"/>
      <rect x="46" y="226" width="86" height="28" fill="#F0EADC" stroke="#8C7442"/>
      <text x="89" y="244" text-anchor="middle">fundamentals</text>
    </g>
    <g>
      <rect x="210" y="248" width="10" height="44" fill="#3A3026"/>
      <rect x="186" y="226" width="78" height="28" fill="#F0EADC" stroke="#8C7442"/>
      <text x="225" y="244" text-anchor="middle">web craft</text>
    </g>
    <g>
      <rect x="340" y="236" width="10" height="50" fill="#3A3026"/>
      <rect x="314" y="210" width="86" height="28" fill="#F0EADC" stroke="#8C7442"/>
      <text x="357" y="228" text-anchor="middle">backends</text>
    </g>
    <g>
      <rect x="490" y="244" width="10" height="50" fill="#3A3026"/>
      <rect x="466" y="218" width="78" height="28" fill="#F0EADC" stroke="#8C7442"/>
      <text x="505" y="236" text-anchor="middle">cloud</text>
    </g>
    <g>
      <rect x="630" y="236" width="10" height="52" fill="#3A3026"/>
      <rect x="592" y="204" width="110" height="32" fill="#FBF6E9" stroke="#EDAE49" stroke-width="2"/>
      <text x="647" y="224" text-anchor="middle">you are here</text>
      <text x="647" y="196" text-anchor="middle" font-size="10" fill="#EDAE49">agentic systems</text>
    </g>
    <g>
      <rect x="760" y="248" width="10" height="44" fill="#3A3026"/>
      <rect x="738" y="224" width="70" height="28" fill="#DFD5C1" stroke="#8C7442"/>
      <text x="773" y="242" text-anchor="middle">rust</text>
    </g>
  </g>

  <text x="500" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#F0EADC">the long walk</text>
  <text x="500" y="66" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#C8A868">same route, on foot, after dark</text>

  <g>
    <animateMotion path="M40 292 C 160 280, 240 300, 340 290 C 460 276, 560 300, 660 290" dur="14s" repeatCount="indefinite"/>
    <g transform="translate(-18 -28) scale(1.4)">
      <rect x="2" y="8" width="6" height="5" fill="#C45C32"/>
      <rect x="8" y="6" width="8" height="8" fill="#C45C32"/>
      <rect x="14" y="8" width="6" height="5" fill="#E8C49A"/>
      <rect x="18" y="9" width="3" height="3" fill="#2A1810"/>
      <rect x="6" y="14" width="3" height="4" fill="#8B3A22"/>
      <rect x="12" y="14" width="3" height="4" fill="#8B3A22"/>
      <rect x="0" y="10" width="4" height="2" fill="#C45C32"/>
      <rect x="21" y="9" width="3" height="2" fill="#EDAE49"/>
    </g>
  </g>

  <text x="500" y="430" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#7E9A72">later: distributed systems, and a cottage worth keeping</text>
</svg>
