<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">The long walk</title>
  <desc id="desc">The same route on foot after dark: brass signposts across cold ridges toward a lit forge house, with a small dragon on the path.</desc>
  <defs>
    <linearGradient id="trailSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1013"/>
      <stop offset=".6" stop-color="#1A1C22"/>
      <stop offset="1" stop-color="#20272A"/>
    </linearGradient>
    <radialGradient id="forgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F2C14E" stop-opacity=".45"/>
      <stop offset=".55" stop-color="#E4572E" stop-opacity=".16"/>
      <stop offset="1" stop-color="#E4572E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="400" fill="url(#trailSky)"/>

  <circle cx="120" cy="72" r="1.4" fill="#E9E6DF" opacity=".4"><animate attributeName="opacity" values=".15;.7;.15" dur="4.4s" repeatCount="indefinite"/></circle>
  <circle cx="410" cy="54" r="1.2" fill="#E9E6DF" opacity=".35"><animate attributeName="opacity" values=".6;.15;.6" dur="5.2s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="70" r="1.3" fill="#E9E6DF" opacity=".4"><animate attributeName="opacity" values=".2;.75;.2" dur="4.8s" repeatCount="indefinite"/></circle>
  <circle cx="905" cy="58" r="24" fill="#F7F5F0" opacity=".06"/>
  <circle cx="905" cy="58" r="14" fill="#F7F5F0" opacity=".24"/>

  <path d="M0 210 C 140 176, 260 196, 400 186 C 560 174, 720 158, 1000 176 L1000 460 L0 460 Z" fill="#1C2226"/>
  <path d="M0 270 C 180 244, 340 264, 520 254 C 700 244, 860 226, 1000 254 L1000 460 L0 460 Z" fill="#212B2C"/>
  <path d="M0 330 C 160 302, 300 322, 500 312 C 680 302, 840 318, 1000 302 L1000 460 L0 460 Z" fill="#26332F"/>

  <path d="M40 300 C 160 290, 240 310, 340 300 C 460 286, 560 310, 660 300 C 760 288, 860 310, 960 292" fill="none" stroke="#2A2620" stroke-width="18"/>
  <path d="M40 300 C 160 290, 240 310, 340 300 C 460 286, 560 310, 660 300 C 760 288, 860 310, 960 292" fill="none" stroke="#8A6E1F" stroke-width="6"/>

  <g fill="#1F2C2A">
    <polygon points="90,250 110,200 130,250"/>
    <polygon points="820,230 845,170 870,230"/>
    <polygon points="250,240 268,188 286,240"/>
  </g>
  <g fill="#2A2620">
    <rect x="96" y="248" width="8" height="22"/>
    <rect x="838" y="228" width="10" height="26"/>
    <rect x="256" y="238" width="8" height="20"/>
  </g>

  <ellipse cx="895" cy="216" rx="80" ry="58" fill="url(#forgeGlow)">
    <animate attributeName="opacity" values=".6;1;.6" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <rect x="860" y="210" width="70" height="40" fill="#22252B" stroke="#C9A227" stroke-width="2"/>
  <polygon points="850,210 895,180 940,210" fill="#A33418"/>
  <rect x="888" y="226" width="14" height="22" fill="#F2C14E">
    <animate attributeName="opacity" values=".7;1;.7" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#1B1D22">
    <g>
      <rect x="70" y="248" width="8" height="44" fill="#2A2620"/>
      <rect x="46" y="226" width="86" height="26" fill="#E9E6DF" stroke="#8A6E1F"/>
      <text x="89" y="243" text-anchor="middle">fundamentals</text>
    </g>
    <g>
      <rect x="210" y="248" width="8" height="44" fill="#2A2620"/>
      <rect x="186" y="226" width="78" height="26" fill="#E9E6DF" stroke="#8A6E1F"/>
      <text x="225" y="243" text-anchor="middle">web craft</text>
    </g>
    <g>
      <rect x="340" y="236" width="8" height="50" fill="#2A2620"/>
      <rect x="314" y="210" width="86" height="26" fill="#E9E6DF" stroke="#8A6E1F"/>
      <text x="357" y="227" text-anchor="middle">backends</text>
    </g>
    <g>
      <rect x="490" y="244" width="8" height="50" fill="#2A2620"/>
      <rect x="466" y="218" width="78" height="26" fill="#E9E6DF" stroke="#8A6E1F"/>
      <text x="505" y="235" text-anchor="middle">cloud</text>
    </g>
    <g>
      <rect x="630" y="236" width="8" height="52" fill="#2A2620"/>
      <rect x="592" y="202" width="110" height="34" fill="#F7F5F0" stroke="#F2C14E" stroke-width="2"/>
      <text x="647" y="216" text-anchor="middle">agentic systems</text>
      <text x="647" y="230" text-anchor="middle" font-size="9" fill="#A33418" letter-spacing="1">YOU ARE HERE</text>
    </g>
    <g>
      <rect x="760" y="248" width="8" height="44" fill="#2A2620"/>
      <rect x="738" y="224" width="70" height="26" fill="#C6C2B8" stroke="#8A6E1F"/>
      <text x="773" y="241" text-anchor="middle">rust</text>
    </g>
  </g>

  <text x="500" y="44" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#E9E6DF" letter-spacing="7">THE LONG WALK</text>
  <text x="500" y="68" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#9AA0AC" letter-spacing="2">same route, on foot, after dark</text>

  <g>
    <animateMotion path="M40 292 C 160 280, 240 300, 340 290 C 460 276, 560 300, 660 290" dur="14s" repeatCount="indefinite"/>
    <g transform="translate(-18 -28) scale(1.4)">
      <rect x="2" y="8" width="6" height="5" fill="#C0431F"/>
      <rect x="8" y="6" width="8" height="8" fill="#C0431F"/>
      <rect x="14" y="8" width="6" height="5" fill="#E0B457"/>
      <rect x="18" y="9" width="3" height="3" fill="#14161A"/>
      <rect x="6" y="14" width="3" height="4" fill="#7E2A12"/>
      <rect x="12" y="14" width="3" height="4" fill="#7E2A12"/>
      <rect x="0" y="10" width="4" height="2" fill="#C0431F"/>
      <rect x="21" y="9" width="3" height="2" fill="#F2C14E"/>
    </g>
  </g>

  <text x="500" y="376" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6E9C90">later: distributed systems, and a forge worth keeping</text>
</svg>
