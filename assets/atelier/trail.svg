<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">Learning trail</title>
  <desc id="desc">A storybook trail through sage hills. Wooden signs mark fundamentals, web, backends, cloud, agentic AI, and later destinations. A small dragon walks the path.</desc>
  <defs>
    <linearGradient id="trailSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D3B0"/>
      <stop offset="1" stop-color="#E4D2B0"/>
    </linearGradient>
    <linearGradient id="farHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8AA078"/>
      <stop offset="1" stop-color="#6F8F5E"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="460" fill="url(#trailSky)"/>
  <path d="M0 210 C 140 170, 260 190, 400 180 C 560 168, 720 150, 1000 170 L1000 460 L0 460 Z" fill="url(#farHill)" opacity=".85"/>
  <path d="M0 270 C 180 240, 340 260, 520 250 C 700 240, 860 220, 1000 250 L1000 460 L0 460 Z" fill="#4F6B45"/>
  <path d="M0 330 C 160 300, 300 320, 500 310 C 680 300, 840 316, 1000 300 L1000 460 L0 460 Z" fill="#5C7348"/>

  <!-- dirt path -->
  <path d="M40 300 C 160 290, 240 310, 340 300 C 460 286, 560 310, 660 300 C 760 288, 860 310, 960 292" fill="none" stroke="#C4A574" stroke-width="18" stroke-linecap="round"/>
  <path d="M40 300 C 160 290, 240 310, 340 300 C 460 286, 560 310, 660 300 C 760 288, 860 310, 960 292" fill="none" stroke="#E8C49A" stroke-width="8" stroke-linecap="round"/>

  <!-- trees -->
  <g fill="#4F6B45">
    <polygon points="90,250 110,200 130,250"/>
    <polygon points="820,230 845,170 870,230"/>
    <polygon points="250,240 268,188 286,240"/>
  </g>
  <g fill="#6B4A32">
    <rect x="96" y="248" width="8" height="22"/>
    <rect x="838" y="228" width="10" height="26"/>
    <rect x="256" y="238" width="8" height="20"/>
  </g>

  <!-- cottage -->
  <rect x="860" y="210" width="70" height="40" fill="#E8C49A" stroke="#3A2418" stroke-width="2"/>
  <polygon points="850,210 895,180 940,210" fill="#8B3A22"/>
  <rect x="888" y="226" width="14" height="22" fill="#3A2418"/>

  <!-- wooden signs -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#3A2418">
    <g>
      <rect x="70" y="248" width="10" height="44" fill="#6B4A32"/>
      <rect x="46" y="226" width="86" height="28" fill="#EDE3D0" stroke="#3A2418"/>
      <text x="89" y="244" text-anchor="middle">fundamentals</text>
    </g>
    <g>
      <rect x="210" y="248" width="10" height="44" fill="#6B4A32"/>
      <rect x="186" y="226" width="78" height="28" fill="#EDE3D0" stroke="#3A2418"/>
      <text x="225" y="244" text-anchor="middle">web craft</text>
    </g>
    <g>
      <rect x="340" y="236" width="10" height="50" fill="#6B4A32"/>
      <rect x="314" y="210" width="86" height="28" fill="#EDE3D0" stroke="#3A2418"/>
      <text x="357" y="228" text-anchor="middle">backends</text>
    </g>
    <g>
      <rect x="490" y="244" width="10" height="50" fill="#6B4A32"/>
      <rect x="466" y="218" width="78" height="28" fill="#EDE3D0" stroke="#3A2418"/>
      <text x="505" y="236" text-anchor="middle">cloud</text>
    </g>
    <g>
      <rect x="630" y="236" width="10" height="52" fill="#6B4A32"/>
      <rect x="592" y="204" width="110" height="32" fill="#F6EFE4" stroke="#C45C32" stroke-width="2"/>
      <text x="647" y="224" text-anchor="middle">you are here</text>
      <text x="647" y="196" text-anchor="middle" font-size="10" fill="#8B3A22">agentic systems</text>
    </g>
    <g>
      <rect x="760" y="248" width="10" height="44" fill="#6B4A32"/>
      <rect x="738" y="224" width="70" height="28" fill="#EDE3D0" stroke="#3A2418"/>
      <text x="773" y="242" text-anchor="middle">rust</text>
    </g>
  </g>

  <text x="500" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#3A2418">the long walk</text>
  <text x="500" y="66" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#6B4A32">a trail, not a transit map from a spaceship</text>

  <!-- walking dragon along the path -->
  <g>
    <animateMotion path="M40 292 C 160 280, 240 300, 340 290 C 460 276, 560 300, 660 290" dur="14s" repeatCount="indefinite"/>
    <g transform="translate(-18 -28) scale(1.4)">
      <rect x="2" y="8" width="6" height="5" fill="#C45C32"/>
      <rect x="8" y="6" width="8" height="8" fill="#C45C32"/>
      <rect x="14" y="8" width="6" height="5" fill="#E8C49A"/>
      <rect x="18" y="9" width="3" height="3" fill="#3A2418"/>
      <rect x="6" y="14" width="3" height="4" fill="#8B3A22"/>
      <rect x="12" y="14" width="3" height="4" fill="#8B3A22"/>
      <rect x="0" y="10" width="4" height="2" fill="#C45C32"/>
    </g>
  </g>

  <text x="500" y="430" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#F4EBD8">later: distributed systems, and a cottage worth keeping</text>
</svg>
