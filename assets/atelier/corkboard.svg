<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Workbench corkboard</title>
  <desc id="desc">A cream corkboard of pinned notes for languages, web, data, infrastructure, and AI. Dark ink on paper, terracotta pins, sage twine.</desc>
  <defs>
    <pattern id="cork" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#E4D2B0"/>
      <circle cx="3" cy="5" r="0.8" fill="#C4A574" opacity=".35"/>
      <circle cx="12" cy="11" r="0.7" fill="#B08D62" opacity=".28"/>
      <circle cx="9" cy="2" r="0.6" fill="#8B6E58" opacity=".18"/>
    </pattern>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#3A2418" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#5C3A24"/>
  <rect x="28" y="28" width="1144" height="704" fill="url(#cork)"/>
  <rect x="28" y="28" width="1144" height="704" fill="none" stroke="#3A2418" stroke-width="10"/>
  <rect x="40" y="40" width="1120" height="16" fill="#8A5A38"/>

  <text x="600" y="78" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#3A2418">the workbench</text>
  <text x="600" y="102" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#6B4A32">pinned notes, not a constellation in the void</text>

  <!-- sage twine -->
  <path d="M180 210 C 320 160, 480 250, 600 200 C 740 140, 900 230, 1040 180" fill="none" stroke="#6F8F5E" stroke-width="2" stroke-dasharray="6 10"/>
  <path d="M160 430 C 340 390, 520 470, 700 420 C 860 380, 980 450, 1080 410" fill="none" stroke="#6F8F5E" stroke-width="2" stroke-dasharray="6 10"/>

  <!-- notes -->
  <g font-family="Georgia, 'Times New Roman', serif" filter="url(#paper)">
    <g>
      <rect x="90" y="150" width="200" height="150" fill="#F6EFE4"/>
      <circle cx="190" cy="158" r="7" fill="#C45C32"/>
      <text x="190" y="198" text-anchor="middle" font-size="13" fill="#8B3A22">languages</text>
      <text x="190" y="226" text-anchor="middle" font-size="14" fill="#3A2418">Python  /  TypeScript</text>
      <text x="190" y="248" text-anchor="middle" font-size="14" fill="#3A2418">JavaScript  /  Go  /  SQL</text>
      <text x="190" y="270" text-anchor="middle" font-size="14" fill="#3A2418">C++  /  C  /  PHP  /  Shell</text>
    </g>
    <g>
      <rect x="340" y="178" width="200" height="150" fill="#F3E6C9" transform="rotate(-2 440 253)"/>
      <circle cx="440" cy="186" r="7" fill="#C45C32"/>
      <text x="440" y="226" text-anchor="middle" font-size="13" fill="#8B3A22">web / app</text>
      <text x="440" y="254" text-anchor="middle" font-size="14" fill="#3A2418">React  /  Next.js  /  Vite</text>
      <text x="440" y="276" text-anchor="middle" font-size="14" fill="#3A2418">Tailwind  /  Three.js</text>
      <text x="440" y="298" text-anchor="middle" font-size="14" fill="#3A2418">Node  /  FastAPI  /  Django</text>
    </g>
    <g>
      <rect x="590" y="150" width="200" height="150" fill="#F6EFE4" transform="rotate(1.5 690 225)"/>
      <circle cx="690" cy="158" r="7" fill="#6F8F5E"/>
      <text x="690" y="198" text-anchor="middle" font-size="13" fill="#4F6B45">data</text>
      <text x="690" y="226" text-anchor="middle" font-size="14" fill="#3A2418">PostgreSQL  /  Redis</text>
      <text x="690" y="248" text-anchor="middle" font-size="14" fill="#3A2418">MongoDB  /  SQLite</text>
      <text x="690" y="270" text-anchor="middle" font-size="14" fill="#3A2418">pgvector</text>
    </g>
    <g>
      <rect x="840" y="170" width="200" height="150" fill="#F3E6C9" transform="rotate(2 940 245)"/>
      <circle cx="940" cy="178" r="7" fill="#C45C32"/>
      <text x="940" y="218" text-anchor="middle" font-size="13" fill="#8B3A22">infra</text>
      <text x="940" y="246" text-anchor="middle" font-size="14" fill="#3A2418">AWS  /  Docker</text>
      <text x="940" y="268" text-anchor="middle" font-size="14" fill="#3A2418">Kubernetes  /  Bash</text>
      <text x="940" y="290" text-anchor="middle" font-size="14" fill="#3A2418">Terraform  /  Cloudflare</text>
    </g>
    <g>
      <rect x="160" y="390" width="230" height="170" fill="#F6EFE4"/>
      <circle cx="275" cy="398" r="7" fill="#C4897A"/>
      <text x="275" y="448" text-anchor="middle" font-size="13" fill="#8B3A22">intelligence</text>
      <text x="275" y="476" text-anchor="middle" font-size="14" fill="#3A2418">OpenAI  /  Anthropic</text>
      <text x="275" y="498" text-anchor="middle" font-size="14" fill="#3A2418">LangChain  /  MCP</text>
      <text x="275" y="520" text-anchor="middle" font-size="14" fill="#3A2418">Hugging Face  /  PyTorch</text>
    </g>
    <g>
      <rect x="460" y="410" width="250" height="170" fill="#F3E6C9" transform="rotate(-1.5 585 495)"/>
      <circle cx="585" cy="418" r="7" fill="#6F8F5E"/>
      <text x="585" y="468" text-anchor="middle" font-size="13" fill="#4F6B45">how it is used</text>
      <text x="585" y="496" text-anchor="middle" font-size="14" fill="#3A2418">Python for systems and AI</text>
      <text x="585" y="518" text-anchor="middle" font-size="14" fill="#3A2418">TypeScript for product surfaces</text>
      <text x="585" y="540" text-anchor="middle" font-size="14" fill="#3A2418">C++ when the machine must be close</text>
    </g>
    <g>
      <rect x="800" y="400" width="230" height="170" fill="#F6EFE4" transform="rotate(1 915 485)"/>
      <circle cx="915" cy="408" r="7" fill="#C45C32">
        <animate attributeName="r" values="7;8.5;7" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text x="915" y="456" text-anchor="middle" font-size="13" fill="#8B3A22">currently pinning</text>
      <text x="915" y="488" text-anchor="middle" font-size="14" fill="#3A2418">agentic review loops</text>
      <text x="915" y="510" text-anchor="middle" font-size="14" fill="#3A2418">local tools with manners</text>
      <text x="915" y="532" text-anchor="middle" font-size="14" fill="#3A2418">systems people can keep</text>
    </g>
  </g>

  <text x="80" y="720" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#F4EBD8">paper, pins, twine</text>
  <text x="1120" y="720" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#F4EBD8">muxby atelier</text>
</svg>
