<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Banked coals</title>
  <desc id="desc">An iron dish of banked embers glowing on graphite, with sparks rising.</desc>
  <defs>
    <linearGradient id="duskSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1013"/>
      <stop offset=".42" stop-color="#1A1C22"/>
      <stop offset="1" stop-color="#20272A"/>
    </linearGradient>
    <linearGradient id="paperSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2026"/>
      <stop offset="1" stop-color="#141519"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B2E"/>
      <stop offset="1" stop-color="#191F22"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26332F"/>
      <stop offset="1" stop-color="#1A2421"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2D35"/>
      <stop offset="1" stop-color="#1A1C22"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A6E1F"/>
      <stop offset=".55" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#E0B94A"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="40%" r="50%">
      <stop offset="0" stop-color="#F2C14E" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#E4572E" stop-opacity=".22"/>
      <stop offset="1" stop-color="#E4572E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hearth" cx="50%" cy="60%" r="50%">
      <stop offset="0" stop-color="#FFE3A3" stop-opacity=".6"/>
      <stop offset=".5" stop-color="#E4572E" stop-opacity=".22"/>
      <stop offset="1" stop-color="#E4572E" stop-opacity="0"/>
    </radialGradient>
    <filter id="softPaper" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity=".5"/>
    </filter>
    
  </defs>
  <rect width="520" height="220" fill="#17181C"/>
  <rect x="8" y="8" width="504" height="204" fill="none" stroke="#8A6E1F" stroke-width="1" opacity=".6"/>
  <text x="260" y="38" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#E9E6DF" letter-spacing="6">BANKED COALS</text>
  <ellipse cx="260" cy="118" rx="150" ry="58" fill="url(#hearth)">
    <animate attributeName="opacity" values=".5;.9;.5" dur="3.2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="260" cy="140" rx="130" ry="42" fill="#2A2D35"/>
  <ellipse cx="260" cy="138" rx="118" ry="34" fill="#1A1C22"/>
  <path d="M142 140 A118 34 0 0 0 378 140" fill="none" stroke="#8A6E1F" stroke-width="2" opacity=".7"/>
  <ellipse cx="200" cy="132" rx="26" ry="12" fill="#A33418"><animate attributeName="opacity" values=".55;1;.55" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></ellipse><ellipse cx="248" cy="126" rx="30" ry="13" fill="#E4572E"><animate attributeName="opacity" values=".55;1;.55" dur="2.75s" begin="0.4s" repeatCount="indefinite"/></ellipse><ellipse cx="300" cy="134" rx="24" ry="11" fill="#A33418"><animate attributeName="opacity" values=".55;1;.55" dur="3.0999999999999996s" begin="0.8s" repeatCount="indefinite"/></ellipse><ellipse cx="224" cy="144" rx="22" ry="9" fill="#F2A03C"><animate attributeName="opacity" values=".55;1;.55" dur="3.4499999999999997s" begin="1.2000000000000002s" repeatCount="indefinite"/></ellipse><ellipse cx="280" cy="146" rx="20" ry="9" fill="#E4572E"><animate attributeName="opacity" values=".55;1;.55" dur="3.8s" begin="1.6s" repeatCount="indefinite"/></ellipse>
<circle cx="214" cy="96" r="1.8" fill="#F2C14E" opacity=".2"><animate attributeName="opacity" values=".15;.95;.15" dur="3.1s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="cy" values="96;86;96" dur="4.6s" repeatCount="indefinite"/></circle>
<circle cx="262" cy="84" r="1.8" fill="#F2C14E" opacity=".2"><animate attributeName="opacity" values=".15;.95;.15" dur="3.8s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="cy" values="84;74;84" dur="5.3s" repeatCount="indefinite"/></circle>
<circle cx="312" cy="98" r="1.8" fill="#F2C14E" opacity=".2"><animate attributeName="opacity" values=".15;.95;.15" dur="3.4s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="cy" values="98;88;98" dur="4.9s" repeatCount="indefinite"/></circle>
  <text x="260" y="198" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9AA0AC" letter-spacing="3">NEVER FULLY OUT</text>

</svg>
