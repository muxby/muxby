<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img" aria-labelledby="title desc" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision">
  <title id="title">Desk with a polaroid</title>
  <desc id="desc">An iron desk at night: a brass lamp, a closed notebook, and a bone polaroid of a tiny dragon.</desc>
  <defs>
    <radialGradient id="lampGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#F2C14E" stop-opacity=".6"/>
      <stop offset=".5" stop-color="#E4572E" stop-opacity=".16"/>
      <stop offset="1" stop-color="#E4572E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="520" height="320" fill="#0F1013"/>
  <ellipse cx="308" cy="120" rx="150" ry="120" fill="url(#lampGlow)">
    <animate attributeName="opacity" values=".7;1;.7" dur="3.6s" repeatCount="indefinite"/>
  </ellipse>
  <rect x="0" y="210" width="520" height="110" fill="#1E2026"/>
  <rect x="0" y="210" width="520" height="6" fill="#8A6E1F"/>
  <rect x="40" y="48" width="220" height="250" fill="#E9E6DF"/>
  <rect x="40" y="48" width="220" height="250" fill="none" stroke="#8A6E1F" stroke-width="2"/>
  <rect x="58" y="66" width="184" height="150" fill="#17181C"/>
  <!-- the subject: a very small dragon -->
  <rect x="118" y="104" width="8" height="8" fill="#DCD6C8"/>
  <rect x="154" y="104" width="8" height="8" fill="#DCD6C8"/>
  <rect x="112" y="112" width="56" height="44" fill="#C0431F"/>
  <rect x="124" y="124" width="12" height="12" fill="#F7F5F0"/>
  <rect x="128" y="128" width="6" height="6" fill="#111214"/>
  <rect x="168" y="130" width="14" height="10" fill="#C0431F"/>
  <rect x="182" y="132" width="8" height="6" fill="#F2C14E"/>
  <rect x="104" y="164" width="16" height="10" fill="#C0431F"/>
  <rect x="120" y="156" width="44" height="34" fill="#C0431F"/>
  <rect x="130" y="162" width="26" height="26" fill="#E0B457"/>
  <rect x="126" y="190" width="10" height="8" fill="#DCD6C8"/>
  <rect x="148" y="190" width="10" height="8" fill="#DCD6C8"/>
  <text x="150.88" y="240" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="1.76" fill="#1B1D22">FIRST USEFUL SPARK</text>
  <rect x="300" y="88" width="14" height="122" fill="#8A6E1F"/>
  <path d="M290 88 Q307 62 324 88" fill="#C9A227"/>
  <ellipse cx="307" cy="76" rx="24" ry="16" fill="#F2C14E" opacity=".6">
    <animate attributeName="opacity" values=".4;.8;.4" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <rect x="340" y="168" width="150" height="42" fill="#2A2D35"/>
  <rect x="340" y="168" width="150" height="4" fill="#C9A227"/>
  <rect x="352" y="184" width="90" height="4" fill="#4E535D"/>
  <rect x="352" y="196" width="110" height="4" fill="#4E535D"/>
  <text x="390.88" y="308" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="1.76" fill="#C9A227">THE DESK, NOT THE COCKPIT</text>
