<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img" aria-labelledby="title desc">
  <title id="title">Desk with a polaroid</title>
  <desc id="desc">A walnut desk, a cream polaroid of a tiny dragon, a brass lamp, and a notebook. No holograms.</desc>
  <rect width="520" height="320" fill="#F4EBD8"/>
  <rect x="0" y="210" width="520" height="110" fill="#5C3A24"/>
  <rect x="0" y="210" width="520" height="10" fill="#8A5A38"/>
  <rect x="40" y="48" width="220" height="250" fill="#F6EFE4" stroke="#3A2418" stroke-width="2"/>
  <rect x="58" y="66" width="184" height="150" fill="#E7C4A2"/>
  <rect x="110" y="118" width="70" height="50" fill="#C45C32"/>
  <rect x="124" y="128" width="16" height="12" fill="#FFF8EE"/>
  <rect x="148" y="128" width="16" height="12" fill="#FFF8EE"/>
  <rect x="132" y="148" width="40" height="18" fill="#E8C49A"/>
  <text x="150" y="236" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#3A2418">first useful spark</text>
  <rect x="300" y="88" width="16" height="122" fill="#C4A574"/>
  <path d="M292 88 Q308 64 324 88" fill="#F6EFE4" stroke="#C4A574" stroke-width="3"/>
  <ellipse cx="308" cy="70" rx="36" ry="28" fill="#FFF3A0" opacity=".55">
    <animate attributeName="opacity" values=".35;.75;.35" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <rect x="340" y="168" width="150" height="42" fill="#EDE3D0"/>
  <rect x="352" y="178" width="90" height="6" fill="#C4A574"/>
  <rect x="352" y="190" width="110" height="6" fill="#C4A574"/>
  <text x="260" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#F4EBD8">the desk, not the cockpit</text>
</svg>
