<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90" role="img" aria-label="Restricted area — neural research division">
  <defs>
    <filter id="gGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="90" rx="12" fill="#0D1117" stroke="#FF00E5" stroke-width="1.5" stroke-dasharray="12 6">
    <animate attributeName="stroke-dashoffset" values="0;-36" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- hazard stripes -->
  <g opacity="0.5">
    <rect x="16" y="14" width="10" height="62" fill="#FF00E5" transform="skewX(-20)"/>
    <rect x="36" y="14" width="10" height="62" fill="#0D1117" transform="skewX(-20)"/>
    <rect x="56" y="14" width="10" height="62" fill="#FF00E5" transform="skewX(-20)"/>
    <rect x="856" y="14" width="10" height="62" fill="#00F5FF" transform="skewX(-20)"/>
    <rect x="876" y="14" width="10" height="62" fill="#0D1117" transform="skewX(-20)"/>
    <rect x="896" y="14" width="10" height="62" fill="#00F5FF" transform="skewX(-20)"/>
  </g>

  <!-- glitch text: three offset copies -->
  <g font-family="'Courier New', monospace" font-size="26" font-weight="bold" text-anchor="middle" letter-spacing="6">
    <text x="452" y="52" fill="#00F5FF" opacity="0.7">
       RESTRICTED AREA — NEURAL RESEARCH DIVISION
      <animate attributeName="x" values="452;449;453;452" dur="0.9s" repeatCount="indefinite"/>
    </text>
    <text x="448" y="52" fill="#FF00E5" opacity="0.7">
       RESTRICTED AREA — NEURAL RESEARCH DIVISION
      <animate attributeName="x" values="448;452;446;448" dur="1.1s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="52" fill="#E6EDF3" filter="url(#gGlow)"> RESTRICTED AREA — NEURAL RESEARCH DIVISION</text>
  </g>

  <text x="450" y="76" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="4" fill="#8B949E">CLEARANCE LEVEL Ω REQUIRED · SCANNING VISITOR…</text>

  <!-- scanline -->
  <rect x="0" y="0" width="900" height="2" fill="#00F5FF" opacity="0.4">
    <animate attributeName="y" values="0;88;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- random glitch flash -->
  <rect width="900" height="90" rx="12" fill="#FF00E5" opacity="0">
    <animate attributeName="opacity" values="0;0;0.08;0;0;0;0.05;0" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
