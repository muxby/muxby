<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="The Observatory — live telemetry deck">
  <defs>
    <linearGradient id="aur1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00F5FF" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#3FB950" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aur2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9D4EDD" stop-opacity="0"/>
      <stop offset="40%" stop-color="#9D4EDD" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FF00E5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aur3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF00E5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF00E5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#FF00E5"/>
    </linearGradient>
    <filter id="aurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="aurTextGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="150" rx="14" fill="#0D1117"/>

  <!-- aurora curtains: layered ribbons drifting at different speeds -->
  <path d="M -100 95 Q 150 35 400 75 T 900 65 T 1400 85 L 1400 150 L -100 150 Z" fill="url(#aur1)" filter="url(#aurGlow)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -120 8; 0 0" dur="14s" repeatCount="indefinite"/>
  </path>
  <path d="M -100 105 Q 200 55 500 90 T 1000 75 T 1400 100 L 1400 150 L -100 150 Z" fill="url(#aur2)" filter="url(#aurGlow)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 140 -6; 0 0" dur="18s" repeatCount="indefinite"/>
  </path>
  <path d="M -100 118 Q 250 80 550 105 T 1050 95 T 1400 115 L 1400 150 L -100 150 Z" fill="url(#aur3)" filter="url(#aurGlow)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -90 4; 0 0" dur="22s" repeatCount="indefinite"/>
  </path>

  <!-- stars above the aurora -->
  <g fill="#E6EDF3">
    <circle cx="90" cy="30" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="18" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="22" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="34" r="1.2"><animate attributeName="opacity" values="1;0.25;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="14" r="1.6" fill="#FFD700"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- telescope dome silhouette -->
  <g opacity="0.9">
    <path d="M 1085 128 A 30 30 0 0 1 1145 128 Z" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <line x1="1115" y1="100" x2="1132" y2="78" stroke="#8B949E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1134" cy="75" r="2.5" fill="#00F5FF"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <text x="600" y="72" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" letter-spacing="12" fill="url(#aurText)" filter="url(#aurTextGlow)"> THE OBSERVATORY</text>
  <text x="600" y="98" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="13" letter-spacing="6" fill="#8B949E">L I V E &#160; T E L E M E T R Y &#160; D E C K</text>

  <!-- satellite crossing -->
  <g>
    <circle r="2" fill="#FFD700"/>
    <line x1="-8" y1="0" x2="-3" y2="0" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
    <animateMotion path="M -20 45 Q 600 10 1220 40" dur="16s" repeatCount="indefinite"/>
  </g>
</svg>
