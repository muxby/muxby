  <animateTransform attributeName="transform" type="translate" values="0 0; -8 -40" dur="2.4s" begin="0.0s" repeatCount="indefinite"/>
</g><g fill="#6B7078" opacity="0">
  <ellipse cx="230" cy="70" rx="8" ry="12"/>
