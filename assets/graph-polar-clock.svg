<svg xmlns="http://www.w3.org/2000/svg" width="440" height="420" viewBox="0 0 440 420" role="img" aria-label="Circadian commit clock — output by hour">
  <defs>
    <filter id="pcGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="440" height="420" rx="16" fill="#0D1117" stroke="#30363D"/>
  <text x="220" y="34" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" letter-spacing="5" fill="#8B949E">🕐 CIRCADIAN COMMIT CLOCK</text>

  <!-- reference rings, center (220,215) -->
  <g fill="none" stroke="#21262D" stroke-width="1">
    <circle cx="220" cy="215" r="50"/>
    <circle cx="220" cy="215" r="90" stroke-dasharray="3 5"/>
    <circle cx="220" cy="215" r="130" stroke-dasharray="3 5"/>
  </g>

  <!-- 24 hour rays; each line base r=50, rotated hour*15° about (220,215).
       0° = midnight at top. length ∝ commits that hour. -->
  <g stroke-linecap="round">
    <line x1="220" y1="165" x2="220" y2="93"  stroke="#6E7681" stroke-width="7" transform="rotate(0 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="77"  stroke="#79C0FF" stroke-width="7" transform="rotate(15 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="85"  stroke="#6E7681" stroke-width="7" transform="rotate(30 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="121" stroke="#6E7681" stroke-width="7" transform="rotate(45 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="147" stroke="#30363D" stroke-width="7" transform="rotate(60 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="155" stroke="#30363D" stroke-width="7" transform="rotate(75 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="157" stroke="#30363D" stroke-width="7" transform="rotate(90 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="149" stroke="#30363D" stroke-width="7" transform="rotate(105 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="137" stroke="#1F6FEB" stroke-width="7" transform="rotate(120 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="127" stroke="#1F6FEB" stroke-width="7" transform="rotate(135 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="117" stroke="#388BFD" stroke-width="7" transform="rotate(150 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="111" stroke="#388BFD" stroke-width="7" transform="rotate(165 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="123" stroke="#1F6FEB" stroke-width="7" transform="rotate(180 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="107" stroke="#388BFD" stroke-width="7" transform="rotate(195 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="99"  stroke="#388BFD" stroke-width="7" transform="rotate(210 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="103" stroke="#388BFD" stroke-width="7" transform="rotate(225 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="113" stroke="#1F6FEB" stroke-width="7" transform="rotate(240 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="125" stroke="#1F6FEB" stroke-width="7" transform="rotate(255 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="119" stroke="#1F6FEB" stroke-width="7" transform="rotate(270 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="105" stroke="#388BFD" stroke-width="7" transform="rotate(285 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="95"  stroke="#58A6FF" stroke-width="7" transform="rotate(300 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="89"  stroke="#58A6FF" stroke-width="7" transform="rotate(315 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="87"  stroke="#58A6FF" stroke-width="7" transform="rotate(330 220 215)"/>
    <line x1="220" y1="165" x2="220" y2="91"  stroke="#6E7681" stroke-width="7" transform="rotate(345 220 215)"/>
  </g>

  <!-- golden peak: 01:47 AM marker -->
  <g transform="rotate(15 220 215)">
    <circle cx="220" cy="72" r="6" fill="#D0D7DE" filter="url(#pcGlow)">
      <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="330" y="90" font-family="'Courier New', monospace" font-size="11" fill="#D0D7DE" text-anchor="middle">★ 01:47 AM</text>
  <text x="330" y="105" font-family="'Courier New', monospace" font-size="9" fill="#8B949E" text-anchor="middle">peak output</text>

  <!-- rotating sweep hand -->
  <line x1="220" y1="215" x2="220" y2="80" stroke="#E6EDF3" stroke-width="1" opacity="0.35">
    <animateTransform attributeName="transform" type="rotate" from="0 220 215" to="360 220 215" dur="12s" repeatCount="indefinite"/>
  </line>
  <circle cx="220" cy="215" r="5" fill="#0D1117" stroke="#58A6FF" stroke-width="2" filter="url(#pcGlow)"/>

  <!-- hour labels -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#8B949E" text-anchor="middle">
    <text x="220" y="62">00</text>
    <text x="372" y="220">06</text>
    <text x="220" y="378">12</text>
    <text x="70" y="220">18</text>
  </g>

  <!-- night/day arcs -->
  <g font-family="'Courier New', monospace" font-size="10">
    <text x="313" y="140" fill="#6E7681">☾ night shift</text>
    <text x="118" y="322" fill="#388BFD" text-anchor="end">☀ day shift</text>
  </g>

  <text x="220" y="404" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#484F58">the void is quietest at 2am — that's when it listens best</text>
</svg>
