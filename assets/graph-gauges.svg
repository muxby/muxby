<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Cockpit gauge cluster — velocity, focus, uptime">
  <defs>
    <linearGradient id="gArcCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/><stop offset="100%" stop-color="#6E7681"/>
    </linearGradient>
    <linearGradient id="gArcMagenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6E7681"/><stop offset="100%" stop-color="#79C0FF"/>
    </linearGradient>
    <linearGradient id="gArcGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#79C0FF"/><stop offset="100%" stop-color="#D0D7DE"/>
    </linearGradient>
    <filter id="ggGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="250" rx="16" fill="#0D1117" stroke="#30363D"/>
  <text x="450" y="30" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" letter-spacing="6" fill="#8B949E">⌁ COCKPIT INSTRUMENT CLUSTER ⌁</text>

  <!-- ══ GAUGE 1 · UI COVERAGE 67% ══ -->
  <g>
    <!-- track: 240° arc from 210° to -30°, r=62, center (160,150) -->
    <path d="M 106.3 181 A 62 62 0 1 1 213.7 181" fill="none" stroke="#21262D" stroke-width="10" stroke-linecap="round" pathLength="100"/>
    <path d="M 106.3 181 A 62 62 0 1 1 213.7 181" fill="none" stroke="url(#gArcCyan)" stroke-width="10" stroke-linecap="round"
          pathLength="100" stroke-dasharray="67 100" filter="url(#ggGlow)">
      <animate attributeName="stroke-dasharray" values="0 100;67 100" dur="1.8s" fill="freeze"/>
    </path>
    <!-- ticks -->
    <g stroke="#484F58" stroke-width="2">
      <line x1="116" y1="106" x2="122" y2="112" transform="rotate(0 160 150)"/>
      <line x1="160" y1="82" x2="160" y2="90"/>
      <line x1="204" y1="106" x2="198" y2="112"/>
    </g>
    <!-- needle: rotates from -120° (min) to +91.2° (88%) with overshoot -->
    <g transform="rotate(40 160 150)">
      <line x1="160" y1="150" x2="160" y2="98" stroke="#E6EDF3" stroke-width="3" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate"
          values="-211 160 150; 45 160 150; 35 160 150; 0 160 150" keyTimes="0;0.6;0.8;1" dur="2s" fill="freeze"/>
      </line>
    </g>
    <circle cx="160" cy="150" r="7" fill="#0D1117" stroke="#58A6FF" stroke-width="2.5" filter="url(#ggGlow)"/>
    <text x="160" y="205" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#58A6FF">67%</text>
    <text x="160" y="226" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="3" fill="#8B949E">UI COVERAGE</text>
  </g>

  <!-- ══ GAUGE 2 · AI/ML COVERAGE 57% ══ -->
  <g>
    <path d="M 396.3 181 A 62 62 0 1 1 503.7 181" fill="none" stroke="#21262D" stroke-width="10" stroke-linecap="round" pathLength="100"/>
    <path d="M 396.3 181 A 62 62 0 1 1 503.7 181" fill="none" stroke="url(#gArcMagenta)" stroke-width="10" stroke-linecap="round"
          pathLength="100" stroke-dasharray="57 100" filter="url(#ggGlow)">
      <animate attributeName="stroke-dasharray" values="0 100;57 100" dur="1.8s" begin="0.3s" fill="freeze"/>
    </path>
    <g stroke="#484F58" stroke-width="2">
      <line x1="450" y1="82" x2="450" y2="90"/>
      <line x1="406" y1="106" x2="412" y2="112"/>
      <line x1="494" y1="106" x2="488" y2="112"/>
    </g>
    <g transform="rotate(17 450 150)">
      <line x1="450" y1="150" x2="450" y2="98" stroke="#E6EDF3" stroke-width="3" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate"
          values="-225 450 150; 22 450 150; 12 450 150; 0 450 150" keyTimes="0;0.6;0.8;1" dur="2.2s" fill="freeze"/>
      </line>
    </g>
    <circle cx="450" cy="150" r="7" fill="#0D1117" stroke="#79C0FF" stroke-width="2.5" filter="url(#ggGlow)"/>
    <text x="450" y="205" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#79C0FF">57%</text>
    <text x="450" y="226" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="3" fill="#8B949E">AI/ML COVERAGE</text>
  </g>

  <!-- ══ GAUGE 3 · OPS COVERAGE 60% ══ -->
  <g>
    <path d="M 686.3 181 A 62 62 0 1 1 793.7 181" fill="none" stroke="#21262D" stroke-width="10" stroke-linecap="round" pathLength="100"/>
    <path d="M 686.3 181 A 62 62 0 1 1 793.7 181" fill="none" stroke="url(#gArcGold)" stroke-width="10" stroke-linecap="round"
          pathLength="100" stroke-dasharray="60 100" filter="url(#ggGlow)">
      <animate attributeName="stroke-dasharray" values="0 100;60 100" dur="1.8s" begin="0.6s" fill="freeze"/>
    </path>
    <g stroke="#484F58" stroke-width="2">
      <line x1="740" y1="82" x2="740" y2="90"/>
      <line x1="696" y1="106" x2="702" y2="112"/>
      <line x1="784" y1="106" x2="778" y2="112"/>
    </g>
    <g transform="rotate(24 740 150)">
      <line x1="740" y1="150" x2="740" y2="98" stroke="#E6EDF3" stroke-width="3" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate"
          values="-239 740 150; 30 740 150; 20 740 150; 0 740 150" keyTimes="0;0.6;0.8;1" dur="2.4s" fill="freeze"/>
      </line>
    </g>
    <circle cx="740" cy="150" r="7" fill="#0D1117" stroke="#D0D7DE" stroke-width="2.5" filter="url(#ggGlow)"/>
    <text x="740" y="205" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#D0D7DE">60%</text>
    <text x="740" y="226" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="3" fill="#8B949E">OPS COVERAGE</text>
  </g>

  <!-- blinking status LEDs -->
  <circle cx="30" cy="30" r="4" fill="#8B949E"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <circle cx="870" cy="30" r="4" fill="#58A6FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/></circle>
</svg>
