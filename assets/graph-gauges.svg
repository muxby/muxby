<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Cockpit gauge cluster — velocity, focus, uptime">
  <defs>
    <linearGradient id="gArcCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/><stop offset="100%" stop-color="#9D4EDD"/>
    </linearGradient>
    <linearGradient id="gArcMagenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9D4EDD"/><stop offset="100%" stop-color="#FF00E5"/>
    </linearGradient>
    <linearGradient id="gArcGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF00E5"/><stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <filter id="ggGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="250" rx="16" fill="#0D1117" stroke="#30363D"/>
  <text x="450" y="30" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" letter-spacing="6" fill="#8B949E">⌁ COCKPIT INSTRUMENT CLUSTER ⌁</text>

  <!-- ══ GAUGE 1 · SHIP VELOCITY 88% ══ -->
  <g>
    <!-- track: 240° arc from 210° to -30°, r=62, center (160,150) -->
    <path d="M 106.3 181 A 62 62 0 1 1 213.7 181" fill="none" stroke="#21262D" stroke-width="10" stroke-linecap="round" pathLength="100"/>
    <path d="M 106.3 181 A 62 62 0 1 1 213.7 181" fill="none" stroke="url(#gArcCyan)" stroke-width="10" stroke-linecap="round"
          pathLength="100" stroke-dasharray="88 100" filter="url(#ggGlow)">
      <animate attributeName="stroke-dasharray" values="0 100;88 100" dur="1.8s" fill="freeze"/>
    </path>
    <!-- ticks -->
    <g stroke="#484F58" stroke-width="2">
      <line x1="116" y1="106" x2="122" y2="112" transform="rotate(0 160 150)"/>
      <line x1="160" y1="82" x2="160" y2="90"/>
      <line x1="204" y1="106" x2="198" y2="112"/>
    </g>
    <!-- needle: rotates from -120° (min) to +91.2° (88%) with overshoot -->
    <g transform="rotate(91 160 150)">
      <line x1="160" y1="150" x2="160" y2="98" stroke="#E6EDF3" stroke-width="3" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate"
          values="-211 160 150; 8 160 150; -6 160 150; 0 160 150" keyTimes="0;0.6;0.8;1" dur="2s" fill="freeze"/>
      </line>
    </g>
    <circle cx="160" cy="150" r="7" fill="#0D1117" stroke="#00F5FF" stroke-width="2.5" filter="url(#ggGlow)"/>
    <text x="160" y="205" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#00F5FF">88%</text>
    <text x="160" y="226" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="3" fill="#8B949E">SHIP VELOCITY</text>
  </g>

  <!-- ══ GAUGE 2 · FOCUS REACTOR 94% ══ -->
  <g>
    <path d="M 396.3 181 A 62 62 0 1 1 503.7 181" fill="none" stroke="#21262D" stroke-width="10" stroke-linecap="round" pathLength="100"/>
    <path d="M 396.3 181 A 62 62 0 1 1 503.7 181" fill="none" stroke="url(#gArcMagenta)" stroke-width="10" stroke-linecap="round"
          pathLength="100" stroke-dasharray="94 100" filter="url(#ggGlow)">
      <animate attributeName="stroke-dasharray" values="0 100;94 100" dur="1.8s" begin="0.3s" fill="freeze"/>
    </path>
    <g stroke="#484F58" stroke-width="2">
      <line x1="450" y1="82" x2="450" y2="90"/>
      <line x1="406" y1="106" x2="412" y2="112"/>
      <line x1="494" y1="106" x2="488" y2="112"/>
    </g>
    <g transform="rotate(105 450 150)">
      <line x1="450" y1="150" x2="450" y2="98" stroke="#E6EDF3" stroke-width="3" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate"
          values="-225 450 150; 10 450 150; -5 450 150; 0 450 150" keyTimes="0;0.6;0.8;1" dur="2.2s" fill="freeze"/>
      </line>
    </g>
    <circle cx="450" cy="150" r="7" fill="#0D1117" stroke="#FF00E5" stroke-width="2.5" filter="url(#ggGlow)"/>
    <text x="450" y="205" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#FF00E5">94%</text>
    <text x="450" y="226" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="3" fill="#8B949E">FOCUS REACTOR</text>
  </g>

  <!-- ══ GAUGE 3 · HULL UPTIME 99.99% ══ -->
  <g>
    <path d="M 686.3 181 A 62 62 0 1 1 793.7 181" fill="none" stroke="#21262D" stroke-width="10" stroke-linecap="round" pathLength="100"/>
    <path d="M 686.3 181 A 62 62 0 1 1 793.7 181" fill="none" stroke="url(#gArcGold)" stroke-width="10" stroke-linecap="round"
          pathLength="100" stroke-dasharray="99.9 100" filter="url(#ggGlow)">
      <animate attributeName="stroke-dasharray" values="0 100;99.9 100" dur="1.8s" begin="0.6s" fill="freeze"/>
    </path>
    <g stroke="#484F58" stroke-width="2">
      <line x1="740" y1="82" x2="740" y2="90"/>
      <line x1="696" y1="106" x2="702" y2="112"/>
      <line x1="784" y1="106" x2="778" y2="112"/>
    </g>
    <g transform="rotate(119 740 150)">
      <line x1="740" y1="150" x2="740" y2="98" stroke="#E6EDF3" stroke-width="3" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate"
          values="-239 740 150; 6 740 150; -3 740 150; 0 740 150" keyTimes="0;0.6;0.8;1" dur="2.4s" fill="freeze"/>
      </line>
    </g>
    <circle cx="740" cy="150" r="7" fill="#0D1117" stroke="#FFD700" stroke-width="2.5" filter="url(#ggGlow)"/>
    <text x="740" y="205" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#FFD700">99.99%</text>
    <text x="740" y="226" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="3" fill="#8B949E">HULL UPTIME</text>
  </g>

  <!-- blinking status LEDs -->
  <circle cx="30" cy="30" r="4" fill="#3FB950"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <circle cx="870" cy="30" r="4" fill="#00F5FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/></circle>
</svg>
