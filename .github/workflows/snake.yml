# ══════════════════════════════════════════════════════════════
#  CONTRIBUTION SNAKE — the other creature in the garden
#  Generates the snake SVGs and publishes them to the `output`
#  branch, which the README embeds.
# ══════════════════════════════════════════════════════════════
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#C45C32&color_dots=#F4EBD8,#E8C49A,#C4897A,#C45C32,#6F8F5E
            dist/github-contribution-grid-snake-dark.svg?color_snake=#E07A3D&color_dots=#1C1510,#3D2B1F,#4F6B45,#C45C32,#E07A3D
            dist/ocean.gif?color_snake=#C45C32&color_dots=#F4EBD8,#E8C49A,#C4897A,#C45C32,#6F8F5E

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
