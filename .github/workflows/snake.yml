# ══════════════════════════════════════════════════════════════
#  CONTRIBUTION SNAKE — feeds on the contribution graph
#  Generates the snake SVGs and publishes them to the `output`
#  branch, which the README embeds.
# ══════════════════════════════════════════════════════════════
name: Generate Contribution Snake

on:
  schedule:
    # every 12 hours — keep the snake well fed
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=#00F5FF&color_dots=#161B22,#0e4429,#006d32,#26a641,#39d353

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
