# ══════════════════════════════════════════════════════════════
#  CONTRIBUTION SNAKE — green glass over the sky field
#  Platane/snk draws the snake; scripts/glass_snake.py lays it
#  on the Ghibli photograph with a frosted plate. Published to
#  the `output` branch, which the README embeds.
# ══════════════════════════════════════════════════════════════
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sky photograph and glass script
        uses: actions/checkout@v4

      - name: Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-sky.svg?color_snake=#56d364&color_dots=#9be9a822,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake.svg?color_snake=#56d364&color_dots=#9be9a822,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?color_snake=#56d364&color_dots=#9be9a822,#9be9a8,#40c463,#30a14e,#216e39

      - name: Lay the snake on liquid glass over the sky
        run: |
          # Platane/snk writes dist/ as root inside Docker, so the
          # runner user cannot overwrite those files in place.
          sudo chmod -R a+rwX dist
          python3 scripts/glass_snake.py \
            dist/github-contribution-grid-snake-sky.svg \
            dist/github-contribution-grid-snake.svg \
            dist/github-contribution-grid-snake-dark.svg

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
