name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  federated-health-ai-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fyp-projects/federated-health-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r backend/requirements-dev.txt
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
      - name: Run tests with coverage
        run: |
          python -m pytest --cov --cov-report=term-missing --cov-fail-under=80

  federated-health-ai-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fyp-projects/federated-health-ai/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fyp-projects/federated-health-ai/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npx vitest run
      - name: Build
        run: npm run build
